title: "Docker Sandboxes with GitHub Copilot (Simulated)"
description: "Lock down an agent's network, build kits, keep credentials out of reach, run agents in parallel and give them tools, all in your browser."

# Catalog card metadata. It's only shown on the landing page when this repo has
# two or more entries (a single lab is entered directly). labs.json is
# GENERATED from this block, so you never write it by hand.
catalog:
  icon: deployed_code
  tags: ["docker sandboxes", "sbx", "ai agents", "github copilot"]
  estimatedMinutes: 60

# Bump this whenever you add, remove or rename steps: stored progress is
# namespaced per version, so stale completion records are cleared.
version: "1.1.0"

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# The original lab uses several terminals on the host: one per agent, one to
# review and merge their work, one for the dashboard. All four tabs share one
# simulated machine (state and filesystem), like four shells on the same laptop.
# Use Terminal 1 until the "Clone mode and parallel agents" module.
terminals:
  - id: t1
    title: Terminal 1
    icon: terminal
  - id: t2
    title: Terminal 2
    icon: terminal
  - id: t3
    title: Terminal 3
    icon: terminal
  - id: t4
    title: Terminal 4
    icon: terminal

sections:
  - title: Welcome
    contentPath: welcome.md

  - title: Prerequisites
    contentPath: 00-prerequisites.md
    steps:
      - id: check-sbx
        title: "Check that sbx is installed"
      - id: sign-in
        title: "Sign in to Docker"
      - id: run-diagnose
        title: "Run sbx diagnose"
      - id: check-policies
        title: "Check that your policies are local"
      - id: clone-repo
        title: "Clone the lab repository"
      - id: warm-up
        title: "Warm up the sandbox images"

  - title: Network policies
    contentPath: 01-network-policies.md
    steps:
      - id: reset-policy
        title: "Switch to the Locked Down policy"
      - id: check-denied
        title: "Check that docker.com is denied"
      - id: shell-blocked
        title: "See the proxy block a request from a sandbox"
      - id: allow-host
        title: "Allow a host"
      - id: shell-allowed
        title: "Reach the allowed host from the sandbox"
      - id: remove-rules
        title: "Remove a custom rule"
      - id: allow-github
        title: "Allow GitHub and Copilot"
      - id: allow-python
        title: "Allow Debian and PyPI"
      - id: allow-docker-hub
        title: "Allow Docker Hub"
      - id: allow-npm
        title: "Allow npm"
      - id: verify-rules
        title: "List the lab's policy"

  - title: Kits
    contentPath: 02-kits.md
    steps:
      - id: inspect-copilot-kit
        title: "Inspect the Copilot kit"
      - id: compare-claude-kit
        title: "Compare with the Claude Code kit"
      - id: validate-python-kit
        title: "Validate the Python kit"
      - id: inspect-python-kit
        title: "Inspect the Python kit"

  - title: Secrets and credentials
    contentPath: 03-secrets-credentials.md
    steps:
      - id: store-github-secret
        title: "Store the github secret"
      - id: store-copilot-secret
        title: "Store the copilot secret"
      - id: list-secrets
        title: "Check that both secrets are stored"

  - title: Agent sandbox
    contentPath: 04-first-sandbox.md
    steps:
      - id: create-sandbox
        title: "Create the quickstart sandbox"
      - id: check-python
        title: "Check that Python came with the kit"
      - id: check-token
        title: "Check that your token isn't in the sandbox"
      - id: check-workspace
        title: "Check what the agent can see of your disk"
      - id: block-upload
        title: "See an upload to a paste site blocked"
      - id: meet-agent
        title: "Meet your agent"

  - title: TUI dashboard
    contentPath: 05-tui-dashboard.md
    steps:
      - id: open-dashboard
        title: "Open the TUI dashboard"

  - title: Run in direct mode
    contentPath: 06-run-in-direct-mode.md
    steps:
      - id: run-tests
        title: "Have the agent run the tests"
      - id: fix-pagination
        title: "Have the agent fix the pagination bug"
      - id: confirm-fix
        title: "Confirm that the pagination tests pass"
      - id: commit-fix
        title: "Review and commit the fix"

  - title: Clone mode and parallel agents
    contentPath: 07-parallel-agents.md
    steps:
      - id: fix-in-clone
        title: "Fix a bug in a private clone"
      - id: merge-fix
        title: "Fetch and merge the clone's commit"
