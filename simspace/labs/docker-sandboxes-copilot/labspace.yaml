        title: "Remove the DHI MCP registration"
      - id: remove-github-secret
        title: "Remove the github secret"
      - id: remove-copilot-secret
        title: "Remove the copilot secret"

  - title: Troubleshooting
    contentPath: troubleshooting.md

# Seed files for the virtual filesystem: the real DevBoard files the lab touches,
# copied from ../../../project. The scenarios edit them (the pagination fix, the
# merged agent work), so `cat` shows the result.
files:
  project/kits/python/python.yaml: |
    # syntax=docker/sandbox-kit:3
    schemaVersion: "3"
    kind: mixin
    displayName: Python
    description: Python 3 with venv and pip, installed when the sandbox is created

    capabilities:
      # Install Python once, as root, when the sandbox is created.
      - type: com.docker.sandbox/lifecycle@1
        config:
          install:
            - description: Install Python 3, venv and pip
              user: "0"
              command: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip

      # Only the hosts this kit needs. For the install: the sandbox image's apt
      # repositories (Debian and Docker Hardened Images), which apt-get update reads.
      # At runtime: PyPI, for pip.
      - type: com.docker.sandbox/network-policy@1
        config:
          install:
            allow: [deb.debian.org:80, dhi.io:80]
          runtime:
            allow: [pypi.org:443, files.pythonhosted.org:443]
  project/kits/api-port/api-port.yaml: |
    # syntax=docker/sandbox-kit:3
    schemaVersion: "3"
    kind: mixin
    displayName: DevBoard API port
    description: Publishes the sandbox's port 8000, where the DevBoard API listens, to the host

    capabilities:
      # Ask for the sandbox port only: sbx picks a free host port on 127.0.0.1.
      - type: com.docker.sandbox/port@1
        config:
          container: 8000
  project/kits/trivy/trivy.yaml: |
    # syntax=docker/sandbox-kit:3
    # Adapted from the trivy-mixin kit of docker/sbx-kits-contrib (v3 branch, Apache-2.0):
    # https://github.com/docker/sbx-kits-contrib/tree/v3/trivy-mixin
    # Changes: shorter comments, no agent-context capability, VEX repositories for
    # Docker Hardened Images, and a scan-images script.
    schemaVersion: "3"
    kind: mixin
    displayName: Trivy
    description: Aqua's open source vulnerability scanner, added to an agent's sandbox
    sourceUrl: https://github.com/aquasecurity/trivy

    # What this kit installs. Keep in step with TRIVY_VERSION in trivy.dockerfile.
    provides: ["trivy@0.70.0"]

    capabilities:
      # Trivy is installed when the kit is built (see trivy.dockerfile), so the
      # sandbox never downloads it. At runtime it reaches the vulnerability
      # database (mirror.gcr.io first, ghcr.io as the fallback, and GHCR's blob
      # storage), and the GitHub hosts that serve the VEX repositories listed in
      # vex-repository.yaml.
      - type: com.docker.sandbox/network-policy@1
        config:
          runtime:
            allow:
              - mirror.gcr.io:443
              - ghcr.io:443
              - pkg-containers.githubusercontent.com:443
              - github.com:443
              - api.github.com:443
              - codeload.github.com:443
              - raw.githubusercontent.com:443
  project/prompts/implement-search.txt: |
    Implement the issue search endpoint in project/backend/app/routers/issues.py.

    The endpoint is GET /projects/{project_id}/issues/search?q= and currently returns 501.
    It should:
    - Require a query string parameter `q`
    - Return the issues of that project whose title OR description contains `q`,
      using case-insensitive matching
    - Return a list of issues using the schema already declared on the route
      (List[schemas.IssueOut])
    - Keep the existing project ownership check
    - Order the results with the most recently updated issues first

    Steps:
    1. Set up the Python environment (see AGENTS.md)
    2. Read the existing list_issues() implementation for reference
    3. Implement the search with SQLAlchemy, for example:
       or_(Issue.title.ilike(f"%{q}%"), Issue.description.ilike(f"%{q}%"))
    4. In project/backend/tests/test_issues.py, remove the xfail marker from
       test_search_finds_matching_issues so it runs as a regular test
    5. Run the tests: cd project/backend && ~/venv/bin/pytest tests/ -v
       The search test must pass. If other tests fail, they are unrelated to search:
       do not change them, just report them.
    6. Keep your changes limited to what search needs, then commit with a descriptive message
  project/prompts/implement-notifications.txt: |
    Implement email notifications in project/backend/app/services/notifications.py.

    The coroutine send_status_change_notification() is currently a stub that only logs.
    It should:
    - Send an email to the issue reporter, and to the assignee when there is one and it
      differs from the reporter, whenever an issue's status changes
    - Use the smtplib standard library (no new dependencies); since smtplib is blocking,
      run it with asyncio.to_thread so the event loop is not blocked
    - Read the SMTP configuration from the environment variables SMTP_HOST, SMTP_PORT,
      SMTP_USER and SMTP_PASS (SMTP_PORT defaults to 587)
    - Gracefully handle missing configuration: log a warning and return instead of crashing
    - Never let an SMTP failure break the API call: catch the error and log it
    - Include the issue title, the old status, the new status and a link in the email body.
      Build the link from the FRONTEND_URL environment variable (default
      http://localhost:3000) plus /projects/<project_id>. You may add an optional
      project_id parameter and pass it from update_issue() in project/backend/app/routers/issues.py.

    Steps:
    1. Set up the Python environment (see AGENTS.md), then read the existing stub and its caller,
       update_issue() in project/backend/app/routers/issues.py
    2. Implement the function
    3. Add unit tests in a NEW file, project/backend/tests/test_notifications.py (do not edit
       existing test files). Mock smtplib.SMTP and confirm that send_message is called, and
       that nothing is sent (and nothing crashes) when the SMTP configuration is missing.
       pytest-asyncio is not installed: run the coroutine with asyncio.run().
    4. Run the tests: cd project/backend && ~/venv/bin/pytest tests/ -v
       Your new tests must pass. If other tests fail, they are unrelated to notifications:
       do not change them, just report them.
    5. Keep your changes limited to what notifications need, then commit with a descriptive message
