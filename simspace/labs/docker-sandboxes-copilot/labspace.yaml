    from typing import List, Optional

    from fastapi import APIRouter, Depends, HTTPException, Query
    from sqlalchemy.orm import Session

    from app import models, schemas
    from app.auth import get_current_user
    from app.database import get_db
    from app.services.notifications import send_status_change_notification

    router = APIRouter(prefix="/projects/{project_id}/issues", tags=["issues"])


    def _get_project_or_404(project_id: int, db: Session, user_id: int) -> models.Project:
        project = db.query(models.Project).filter(models.Project.id == project_id).first()
        if not project:
            raise HTTPException(status_code=404, detail="Project not found")
        if project.owner_id != user_id:
            raise HTTPException(status_code=403, detail="Not authorized")
        return project


    # ── Create ────────────────────────────────────────────────────────────────────


    @router.post("/", response_model=schemas.IssueOut, status_code=201)
    def create_issue(
        project_id: int,
        issue_in: schemas.IssueCreate,
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        _get_project_or_404(project_id, db, current_user.id)
        issue = models.Issue(
            title=issue_in.title,
            description=issue_in.description,
            priority=issue_in.priority,
            project_id=project_id,
            reporter_id=current_user.id,
            assignee_id=issue_in.assignee_id,
        )
        db.add(issue)
        db.commit()
        db.refresh(issue)
        return issue


    # ── List (paginated) ──────────────────────────────────────────────────────────


    @router.get("/", response_model=schemas.PaginatedIssues)
    def list_issues(
        project_id: int,
        page: int = Query(1, ge=1),
        page_size: int = Query(20, ge=1, le=100),
        status: Optional[str] = None,
        priority: Optional[str] = None,
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        _get_project_or_404(project_id, db, current_user.id)

        query = db.query(models.Issue).filter(models.Issue.project_id == project_id)

        if status:
            query = query.filter(models.Issue.status == status)
        if priority:
            query = query.filter(models.Issue.priority == priority)

        total = query.count()

        skip = page * page_size
        items = query.order_by(models.Issue.created_at.desc()).offset(skip).limit(page_size).all()

        return schemas.PaginatedIssues(total=total, page=page, page_size=page_size, items=items)


    # ── Search ────────────────────────────────────────────────────────────────────


    @router.get("/search", response_model=List[schemas.IssueOut])
    def search_issues(
        project_id: int,
        q: str = Query(..., min_length=1, description="Search query"),
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        """
        TODO: Implement full-text search across issue title and description.

        The query parameter `q` should match issues where the title OR description
        contains the search string (case-insensitive). Consider also supporting
        ordering results by relevance.

        For now, returns 501 Not Implemented.
        """
        _get_project_or_404(project_id, db, current_user.id)

        # TODO: replace with real search logic, e.g.:
        # results = (
        #     db.query(models.Issue)
        #     .filter(
        #         models.Issue.project_id == project_id,
        #         or_(
        #             models.Issue.title.ilike(f"%{q}%"),
        #             models.Issue.description.ilike(f"%{q}%"),
        #         ),
        #     )
        #     .order_by(models.Issue.updated_at.desc())
        #     .all()
        # )
        # return results

        raise HTTPException(status_code=501, detail="Search not yet implemented")


    # ── Get one ───────────────────────────────────────────────────────────────────


    @router.get("/{issue_id}", response_model=schemas.IssueOut)
    def get_issue(
        project_id: int,
        issue_id: int,
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        _get_project_or_404(project_id, db, current_user.id)
        issue = (
            db.query(models.Issue)
            .filter(models.Issue.id == issue_id, models.Issue.project_id == project_id)
            .first()
        )
        if not issue:
            raise HTTPException(status_code=404, detail="Issue not found")
        return issue


    # ── Update ────────────────────────────────────────────────────────────────────


    @router.put("/{issue_id}", response_model=schemas.IssueOut)
    async def update_issue(
        project_id: int,
        issue_id: int,
        issue_in: schemas.IssueUpdate,
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        # BUG: Missing authorization check. Any authenticated user who has access
        # to the project can update any issue, regardless of whether they are the
        # reporter or assignee. Add a check like:
        #
        #   if issue.reporter_id != current_user.id and issue.assignee_id != current_user.id:
        #       raise HTTPException(status_code=403, detail="Not authorized to edit this issue")

        _get_project_or_404(project_id, db, current_user.id)
        issue = (
            db.query(models.Issue)
            .filter(models.Issue.id == issue_id, models.Issue.project_id == project_id)
            .first()
        )
        if not issue:
            raise HTTPException(status_code=404, detail="Issue not found")

        old_status = issue.status
        for field, value in issue_in.model_dump(exclude_unset=True).items():
            setattr(issue, field, value)

        db.commit()
        db.refresh(issue)

        if issue_in.status and issue_in.status != old_status:
            assignee_email = issue.assignee.email if issue.assignee else None
            reporter_email = issue.reporter.email if issue.reporter else None
            await send_status_change_notification(
                issue.id,
                issue.title,
                old_status,
                issue.status,
                assignee_email,
                reporter_email,
            )

        return issue


    # ── Delete ────────────────────────────────────────────────────────────────────


    @router.delete("/{issue_id}", status_code=204)
    def delete_issue(
        project_id: int,
        issue_id: int,
        db: Session = Depends(get_db),
        current_user: models.User = Depends(get_current_user),
    ):
        _get_project_or_404(project_id, db, current_user.id)
        issue = (
            db.query(models.Issue)
            .filter(models.Issue.id == issue_id, models.Issue.project_id == project_id)
            .first()
        )
        if not issue:
            raise HTTPException(status_code=404, detail="Issue not found")
        if issue.reporter_id != current_user.id:
            raise HTTPException(status_code=403, detail="Only the reporter can delete an issue")

        db.delete(issue)
        db.commit()
  project/backend/app/models.py: |
    from datetime import datetime, timezone

    from sqlalchemy import (
        Column,
        DateTime,
        Enum,
        ForeignKey,
        Integer,
        String,
        Text,
    )
    from sqlalchemy.orm import relationship

    from app.database import Base


    def utcnow() -> datetime:
        """Current UTC time as a naive datetime (what the DateTime columns store)."""
        return datetime.now(timezone.utc).replace(tzinfo=None)


    # ── Enums ─────────────────────────────────────────────────────────────────────

    IssueStatus = Enum(
        "open", "in_progress", "review", "closed", name="issue_status"
    )
    IssuePriority = Enum(
        "low", "medium", "high", "critical", name="issue_priority"
    )


    # ── Models ────────────────────────────────────────────────────────────────────


    class User(Base):
        __tablename__ = "users"

        id = Column(Integer, primary_key=True, index=True)
        email = Column(String, unique=True, index=True, nullable=False)
        username = Column(String, unique=True, index=True, nullable=False)
        hashed_password = Column(String, nullable=False)
        created_at = Column(DateTime, default=utcnow)

        projects = relationship("Project", back_populates="owner")
        reported_issues = relationship(
            "Issue", foreign_keys="Issue.reporter_id", back_populates="reporter"
        )
        assigned_issues = relationship(
            "Issue", foreign_keys="Issue.assignee_id", back_populates="assignee"
        )
        comments = relationship("Comment", back_populates="author")


    class Project(Base):
        __tablename__ = "projects"

        id = Column(Integer, primary_key=True, index=True)
        name = Column(String, nullable=False)
        description = Column(Text, nullable=True)
        owner_id = Column(Integer, ForeignKey("users.id"), nullable=False)
        created_at = Column(DateTime, default=utcnow)
        updated_at = Column(DateTime, default=utcnow)

        owner = relationship("User", back_populates="projects")
        issues = relationship("Issue", back_populates="project", cascade="all, delete-orphan")


    class Issue(Base):
        __tablename__ = "issues"

        id = Column(Integer, primary_key=True, index=True)
        title = Column(String, nullable=False)
        description = Column(Text, nullable=True)
        status = Column(IssueStatus, default="open", nullable=False)
        priority = Column(IssuePriority, default="medium", nullable=False)
        project_id = Column(Integer, ForeignKey("projects.id"), nullable=False)
        reporter_id = Column(Integer, ForeignKey("users.id"), nullable=False)
        assignee_id = Column(Integer, ForeignKey("users.id"), nullable=True)
        created_at = Column(DateTime, default=utcnow)
        updated_at = Column(DateTime, default=utcnow)

        project = relationship("Project", back_populates="issues")
        reporter = relationship(
            "User", foreign_keys=[reporter_id], back_populates="reported_issues"
        )
        assignee = relationship(
            "User", foreign_keys=[assignee_id], back_populates="assigned_issues"
        )
        comments = relationship(
            "Comment", back_populates="issue", cascade="all, delete-orphan"
        )


    class Comment(Base):
        __tablename__ = "comments"

        id = Column(Integer, primary_key=True, index=True)
        content = Column(Text, nullable=False)
        issue_id = Column(Integer, ForeignKey("issues.id"), nullable=False)
        author_id = Column(Integer, ForeignKey("users.id"), nullable=False)
        created_at = Column(DateTime, default=utcnow)

        issue = relationship("Issue", back_populates="comments")
        author = relationship("User", back_populates="comments")
