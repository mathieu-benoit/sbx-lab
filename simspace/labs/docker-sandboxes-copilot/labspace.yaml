      - id: start-notif-agent
        title: "Start the notifications agent"
      - id: fetch-agents
        title: "Fetch both agents' work"
      - id: merge-agents
        title: "Merge both agents' branches"
      - id: verify-merged
        title: "Run the full suite on the merged result"

  - title: Docker inside the sandbox
    contentPath: 08-docker-inside-the-sandbox.md
    steps:
