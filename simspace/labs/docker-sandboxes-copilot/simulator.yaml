  # sbx ls grows with the lab. One table per stage, picked by state.
  - id: ls-full
    when:
      command: [sbx, ls]
      state: { sandboxes.mcp: true }
    then:
      output:
        - "SANDBOX      AGENT     STATUS    WORKSPACE"
        - "quickstart   copilot   running   /Users/you/sbx-lab/project"
        - "fix-bugs     copilot   running   /Users/you/sbx-lab (clone)"
        - "add-search   copilot   running   /Users/you/sbx-lab (clone)"
        - "add-notif    copilot   running   /Users/you/sbx-lab (clone)"
        - "mcp          copilot   running   /Users/you/sbx-lab/project"
        - "shell-demo   shell     stopped   /Users/you/sbx-lab"

  - id: ls-quickstart
    when:
      command: [sbx, ls]
      state: { sandboxes.quickstart: true }
    then:
      output:
        - "SANDBOX      AGENT     STATUS    WORKSPACE"
        - "quickstart   copilot   running   /Users/you/sbx-lab/project"
        - "shell-demo   shell     stopped   /Users/you/sbx-lab"

  - id: ls-shell-demo
    when:
      command: [sbx, ls]
      state: { sandboxes.shellDemo: true }
    then:
      output:
        - "SANDBOX      AGENT   STATUS    WORKSPACE"
        - "shell-demo   shell   stopped   /Users/you/sbx-lab"

  - id: ls-empty
    when:
      command: [sbx, ls]
    then:
      output: ["No sandboxes."]

  - id: exec-python-version
    completes: check-python
    when:
      command: [sbx, exec, quickstart, python3]
      state: { sandboxes.quickstart: true }
    then:
      output: ["Python 3.13.5"]

  - id: exec-os-release
    when:
      command: [sbx, exec, quickstart, cat]
      state: { sandboxes.quickstart: true }
    then:
      output:
        - 'NAME="Docker Hardened Images (Debian)"'
        - 'ID="debian"'
        - 'VERSION_ID="13"'
        - 'VERSION_CODENAME="trixie"'
        - 'PRETTY_NAME="Docker Hardened Images/Debian GNU/Linux 13 (trixie)"'
        - 'HOME_URL="https://docker.com/products/hardened-images/"'
        - 'BUG_REPORT_URL="https://docker.com/support/"'

  - id: exec-env-token
    completes: check-token
    when:
      command: [sbx, exec, quickstart, sh]
      args:
        -c: "env | grep _TOKEN="
      state: { sandboxes.quickstart: true }
    then:
      output:
        - "GH_TOKEN=proxy-managed"
        - "COPILOT_GITHUB_TOKEN=proxy-managed"

  - id: exec-pwd-ls
    completes: check-workspace
    when:
      command: [sbx, exec, quickstart, sh]
      args:
        -c: "pwd; ls -A ~"
      state: { sandboxes.quickstart: true }
    then:
      output:
        - "/Users/you/sbx-lab/project"
        - ".bashrc"
        - ".config"
        - ".copilot"
        - ".gitconfig"
        - ".profile"

  - id: exec-paste-upload
    completes: block-upload
    when:
      command: [sbx, exec, quickstart, curl]
      state: { sandboxes.quickstart: true }
    then:
      state: { quickstart.pasteTried: true }
      output:
        - "Approval required for paste.rs:443."
        - ""
        - "Review and respond with:"
        - "  sbx policy approval ls"

  - id: exec-no-quickstart
    when:
      command: [sbx, exec, quickstart]
      state: { sandboxes.quickstart: false }
    then:
      stderr:
        - 'Error: sandbox "quickstart" not found. Create it first (see "Agent sandbox").'
      exit: 1

  - id: exec-ports-demo-server
    when:
      command: [sbx, exec, ports-demo, sh]
      state: { sandboxes.portsDemo: true }
    then:
      state: { ports.demoServer: true }

  - id: exec-scan-images
    completes: scan-images
    when:
      command: [sbx, exec, mcp, scan-images]
      state: { sandboxes.mcp: true }
    then:
      state: { scan.done: true }
      output:
        - "Downloading the vulnerability database (about 130 MB) and the VEX statements..."
        - { text: "python:3.12-slim           92 vulnerabilities (0 critical, 15 high)", delay: scan }
        - { text: "dhi.io/python:3.12-alpine  0 vulnerabilities (0 critical, 0 high)", delay: scan }
        - { text: "node:22-alpine             17 vulnerabilities (0 critical, 7 high)", delay: scan }
        - { text: "dhi.io/node:22-alpine      0 vulnerabilities (0 critical, 0 high)", delay: scan }

  - id: exec-no-mcp
    when:
      command: [sbx, exec, mcp]
      state: { sandboxes.mcp: false }
    then:
      stderr:
        - 'Error: sandbox "mcp" not found. Create it first (see "MCP servers").'
      exit: 1

  # ── Starting an agent session ────────────────────────────────────────────

  - id: run-detach
    when:
      command: [sbx, run]
      args:
        --detach: true
        --name: { any: true }
    then:
      output:
        - "✓ Sandbox '{{ args.name }}' is running in the background"

  - id: run-clone-wrong-dir
    when:
      command: [sbx, run, copilot]
      args:
        --clone: true
      state: { cwd: project }
    then:
      stderr:
        - "Error: --clone requires a Git repository"
        - "Run this command from the root of the repository: cd .."
      exit: 1

  - id: run-clone-fix-bugs
    when:
      command: [sbx, run, copilot]
      args:
        --clone: true
        --name: "fix-bugs"
    then:
      state: { sandboxes.fixBugs: true }
      output:
        - "Creating sandbox 'fix-bugs' (clone of /Users/you/sbx-lab, committed code only)..."
        - { text: "✓ Sandbox ready. The agent works in a private Git clone; your working tree is read-only to it.", delay: pull }
      session:
        prompt: "copilot (fix-bugs)> "
        intro:
          - "GitHub Copilot CLI (scripted) · sandbox 'fix-bugs' · private clone"
          - "Running with --yolo. Type /exit to leave this simulated session."
        outro:
          - "Session ended. The sandbox keeps its clone: fetch it with git fetch sandbox-fix-bugs."

  - id: run-clone-add-search
    completes: start-search-agent
    when:
      command: [sbx, run, copilot]
      args:
        --clone: true
        --name: "add-search"
    then:
      state: { sandboxes.addSearch: true }
      output:
        - "Creating sandbox 'add-search' (clone of /Users/you/sbx-lab, committed code only)..."
        - { text: "✓ Sandbox ready.", delay: pull }
      session:
        prompt: "copilot (add-search)> "
        intro:
          - "GitHub Copilot CLI (scripted) · sandbox 'add-search' · private clone"
          - "Starting with the prompt from project/prompts/implement-search.txt"
          - ""
          - "● Read AGENTS.md, backend/app/routers/issues.py (list_issues, search_issues)"
          - "● Set up Python: python3 -m venv ~/venv && ~/venv/bin/pip install -r backend/requirements.txt"
          - "● Edit backend/app/routers/issues.py"
          - "    + from sqlalchemy import or_"
          - "    + filter on title.ilike OR description.ilike, ordered by updated_at desc"
          - "    - raise HTTPException(status_code=501, ...)"
