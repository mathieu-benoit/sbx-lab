        - "  ○ ./kits/trivy — building…"
        - { text: "  ✓ ./kits/trivy — built (29s)", delay: pull }
        - "      sbx-kit-src:trivy-767e12c61bd2"
        - ""
        - "SANDBOX"
        - "  Name:       mcp"
        - "  Agent:      copilot"
        - "  Kits:       docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
