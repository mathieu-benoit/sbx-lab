        - "  MediaType:   application/vnd.oci.image.manifest.v1+json"
        - "  Platform:    linux/arm64"
        - ""
        - "  Name:        docker.io/sbx/copilot:latest@sha256:3a2aa5c6b084f4c3ef61b0df180556dc5c4ddb95366919563468337ae502abf6"
        - "  MediaType:   application/vnd.oci.image.manifest.v1+json"
        - "  Platform:    linux/amd64"

  - id: kit-inspect-claude
    completes: compare-claude-kit
    when:
      command: [sbx, kit, inspect, sbx/claude]
    then:
      output:
        - "  Name:         claude"
        - "  Kind:         sandbox"
        - "  Schema:       v3"
        - "  Display:      Claude Code"
        - "  Binary:       claude"
        - "  Arguments:    model, reasoningEffort"
        - "  Policies:"
        - "    Environment:  2 variables"
        - "  AI files:     /home/agent/.claude/CLAUDE.md"
        - ""
        - "(Abridged: the real output has more fields.)"

  - id: kit-validate-devboard
    completes: validate-python-kit
    when:
      command: [sbx, kit, validate, ./project/kits/devboard]
    then:
      output: ["  ✓ ./project/kits/devboard — valid (directory)"]

  - id: kit-inspect-devboard
    completes: inspect-python-kit
    when:
      command: [sbx, kit, inspect, ./project/kits/devboard]
    then:
      output:
        - "  Name:         devboard"
