        - "never again. Adding onupdate=utcnow refreshes it on every UPDATE."
        - ""
        - "● Edit backend/app/models.py"
        - "    - updated_at = Column(DateTime, default=utcnow)"
        - "    + updated_at = Column(DateTime, default=utcnow, onupdate=utcnow)   (x2)"
        - { text: "● Run: pytest tests/ -v    15 passed, 1 xfailed", delay: work }
