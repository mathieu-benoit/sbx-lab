version: "2.0"

metadata:
  id: docker-sandboxes-copilot
  title: "Docker Sandboxes with GitHub Copilot"
  summary: "Network policies, kits, credentials, direct and clone mode, Docker in the sandbox, port forwarding and MCP, simulated in the browser."

objectives:
  - "Control what an agent can reach with network policies"
  - "Read and build kits"
  - "Give an agent credentials it can use but never read"
  - "Run agents in direct mode, in clone mode and in parallel"
  - "Run Docker inside a sandbox and publish its ports"
  - "Give an agent tools through the MCP gateway"

# In-memory state. Every scenario below reads it in `when.state` and writes it
# in `then.state`; it is the whole "where am I in the lab" model.
state:
  cwd: root                   # root of the repository, or project
  policy:
    stage: balanced           # balanced -> none (after reset) -> locked (after init deny-all)
    dockerAllowed: false      # the docker.com allow rule from the network module
    adsDenied: false
  rules:                      # the four rules the lab adds
    github: false
    python: false
    dockerhub: false
    npm: false
  secrets:
    github: false
    copilot: false
  sandboxes:
    warmupShell: false
    warmupCopilot: false
    shellDemo: false
    quickstart: false
    fixBugs: false
    addSearch: false
    addNotif: false
    mcp: false
    portsDemo: false
  shell:
    blocked: false            # shell-demo hit the proxy
  quickstart:
    pasteTried: false
  cloned: false               # the prerequisites' git clone ran (the files are always there)
  repo:                       # what is in YOUR repository on the host
    paginationCommitted: false
    fixFetched: false
    searchFetched: false
    notifFetched: false
    mergedFix: false
    mergedSearch: false
    mergedNotif: false
  code:
    paginationFixed: false    # the working tree has the pagination fix
  clone:
    fixDone: false            # the fix-bugs agent finished
  stack:
    up: false                 # Docker Compose stack running inside quickstart
  ports:
    api: false
    web: false
    demoServer: false
  mcp:
    registered: false
  scan:
    done: false

settings:
  pace:
    pull: 900       # a layer download or an image build step
    scan: 1100      # a Trivy scan
    work: 700       # an agent doing something

defaults:
  unmatched:
    stderr: ["This command isn't part of the lab: the simulation only knows the commands the modules ask you to run."]
    exit: 127
  unmatchedAgent:
    output: ["This prompt isn't part of the lab. Use the Run button on the prompts of the module, or type /exit to leave the session."]

scenarios:
  # ════════════════════════════════════════════════════════════════════════
  # Plain shell on your host: cd and gh
  # ════════════════════════════════════════════════════════════════════════

  - id: cd-project
    when:
      command: [cd]
      args:
        0: "project"
    then:
      state: { cwd: project }

  - id: cd-up
    when:
      command: [cd]
      args:
        0: ".."
    then:
      state: { cwd: root }

  # The prerequisites clone the lab. The simulated machine already holds the
  # repository (the seed files), so `git clone` only shows the output once, and
  # `cd sbx-lab` lands in its root.
  - id: git-clone-again
    when:
      command: [git, clone]
      args:
        0: "https://github.com/mathieu-benoit/sbx-lab"
      state: { cloned: true }
    then:
      stderr:
        - "fatal: destination path 'sbx-lab' already exists and is not an empty directory."
      exit: 128

  - id: git-clone
    completes: clone-repo
    when:
      command: [git, clone]
      args:
        0: "https://github.com/mathieu-benoit/sbx-lab"
    then:
      state: { cloned: true }
      output:
        - "Cloning into 'sbx-lab'..."
        - "remote: Enumerating objects: 698, done."
        - "remote: Counting objects: 100% (172/172), done."
        - "remote: Compressing objects: 100% (125/125), done."
        - "remote: Total 698 (delta 79), reused 92 (delta 45), pack-reused 526 (from 1)"
        - { text: "Receiving objects: 100% (698/698), 322.05 KiB | 4.35 MiB/s, done.", delay: pull }
        - "Resolving deltas: 100% (404/404), done."

  - id: cd-sbx-lab
    when:
      command: [cd]
      args:
        0: "sbx-lab"
    then:
      state: { cwd: root }

  # Inside a session the terminal handles /exit itself; this is the answer when
  # you type it at a plain host prompt.
  - id: exit-without-session
    when:
      command: ["/exit"]
    then:
      output: ["No agent session is open in this terminal."]

  - id: gh-auth-status
    when:
      command: [gh, auth, status]
    then:
      output:
        - "github.com"
        - "  ✓ Logged in to github.com account your-github-login (keyring)"
        - "  - Active account: true"
        - "  - Git operations protocol: https"
        - "  - Token: gho_************************************"

  # ════════════════════════════════════════════════════════════════════════
  # Module 00: prerequisites
  # ════════════════════════════════════════════════════════════════════════

  - id: sbx-version
    completes: check-sbx
    when:
      command: [sbx, version]
    then:
      output: ["sbx version v0.54.0 4bec4a5"]

  - id: sbx-login
    completes: sign-in
    when:
      command: [sbx, login]
    then:
      output:
        - "Opening https://login.docker.com/activate in your browser..."
        - { text: "Waiting for authentication...", delay: short }
        - { text: "✓ Signed in as your-docker-id", delay: medium }
        - "Default network policy: Balanced"

  - id: sbx-diagnose
    completes: run-diagnose
    when:
      command: [sbx, diagnose]
    then:
      output:
        - "INSTALLATION"
        - "  ✓ sbx CLI"
        - "  ✓ Version"
        - "PLATFORM"
        - { text: "  ✓ Virtualization", delay: short }
        - "  ✓ Daemon"
        - "CONNECTION"
        - { text: "  ✓ Authentication", delay: short }
        - "  ✓ Global network policy"
        - "OPTIONAL"
        - "  ✗ SSH client config (not used by this lab)"
        - ""
        - "All required checks passed."

  - id: sbx-create-warmup-shell
    when:
      command: [sbx, create, shell]
      args:
        --name: "warmup-shell"
    then:
      state: { sandboxes.warmupShell: true }
      output:
        - "  ○ shell — now ships as a kit; resolving docker.io/sbx/shell:latest"
        - ""
        - "SANDBOX"
        - "  Name:       warmup-shell"
        - "  Agent:      shell"
        - "  Kit:        docker.io/sbx/shell@sha256:89ed5d63def6bfb2373d408e3ab6ad55aa5c010f884a182a78299fcf85ea42d1"
        - "  Workspace:  ~/sbx-lab (rw)"
        - "  Image:      docker.io/sbx/shell@sha256:89ed5d63def6bfb2373d408e3ab6ad55aa5c010f884a182a78299fcf85ea42d1"
        - "  CPU:        8"
        - "  Memory:     16 GiB"
        - ""
        - "IMAGE"
        - { text: "  ✓ image — ready", delay: pull }
        - ""
        - "  ✓ Created sandbox warmup-shell"
        - "      try: sbx run --name warmup-shell"

  - id: sbx-create-warmup-copilot
    when:
      command: [sbx, create, copilot]
      args:
        --name: "warmup-copilot"
    then:
      state: { sandboxes.warmupCopilot: true }
      output:
        - "  ○ copilot — now ships as a kit; resolving docker.io/sbx/copilot:latest"
        - ""
        - "SANDBOX"
        - "  Name:       warmup-copilot"
        - "  Agent:      copilot"
        - "  Kit:        docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
        - "  Workspace:  ~/sbx-lab (rw)"
        - "  Skills:     0 entries · linked, read-only"
        - "    Source:   ~/Library/Application Support/com.docker.sandboxes/sandboxes/agent-skills"
        - "    Target:   /home/agent/.copilot/skills"
        - "  Image:      docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
        - "  CPU:        8"
        - "  Memory:     16 GiB"
        - ""
        - "IMAGE"
        - { text: "  ✓ image — ready", delay: pull }
        - ""
        - "  ✓ Created sandbox warmup-copilot"
        - "      try: sbx run --name warmup-copilot"

  # `--force` swallows the first name as its value (see the flag parser), so the
  # command arrives as: sbx rm warmup-copilot  with force=warmup-shell.
  - id: sbx-rm-warmup
    completes: warm-up
    when:
      command: [sbx, rm]
      args:
        0: "warmup-copilot"
    then:
      state:
        sandboxes.warmupShell: false
        sandboxes.warmupCopilot: false
      output:
        - "✓ Removed sandbox 'warmup-shell'"
        - "✓ Removed sandbox 'warmup-copilot'"

  # ════════════════════════════════════════════════════════════════════════
  # Module 01: network policies
  # sbx policy ls shows a different table depending on how far you got.
  # ════════════════════════════════════════════════════════════════════════

  - id: policy-ls-lab-mcp
    completes: verify-rules
    when:
      command: [sbx, policy, ls]
      state:
        rules.github: true
        rules.python: true
        rules.dockerhub: true
        rules.npm: true
        sandboxes.mcp: true
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO           SUMMARY"
        - "default-deny-all   local    all                  network: deny when no rule decides"
        - "local-policy       local    all                  network: 10 allow; filesystem read: 1 allow; filesystem write: 1 allow"
        - "kit-quickstart     kit      sandbox:quickstart   network: the Copilot hosts, plus the Python kit's"
        - "kit-mcp            kit      sandbox:mcp          network: the Copilot hosts, plus the Trivy kit's"

  - id: policy-ls-lab-quickstart
    completes: verify-rules
    when:
      command: [sbx, policy, ls]
      state:
        rules.github: true
        rules.python: true
        rules.dockerhub: true
        rules.npm: true
        sandboxes.quickstart: true
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO           SUMMARY"
        - "default-deny-all   local    all                  network: deny when no rule decides"
        - "local-policy       local    all                  network: 10 allow; filesystem read: 1 allow; filesystem write: 1 allow"
        - "kit-quickstart     kit      sandbox:quickstart   network: the Copilot hosts, plus the Python kit's"

  - id: policy-ls-lab
    completes: verify-rules
    when:
      command: [sbx, policy, ls]
      state:
        rules.github: true
        rules.python: true
        rules.dockerhub: true
        rules.npm: true
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO   SUMMARY"
        - "default-deny-all   local    all          network: deny when no rule decides"
        - "local-policy       local    all          network: 10 allow; filesystem read: 1 allow; filesystem write: 1 allow"

  - id: policy-ls-locked
    when:
      command: [sbx, policy, ls]
      state: { policy.stage: locked }
    then:
      output:
        - "  POLICY             SOURCE   APPLIES TO   SUMMARY"
        - "  default-deny-all   local    all          network: deny when no rule decides"
        - "  local-policy       local    all          filesystem read: 1 allow; filesystem write: 1 allow"

  - id: policy-ls-none
    when:
      command: [sbx, policy, ls]
      state: { policy.stage: none }
    then:
      output:
        - "No policies configured. Choose a default with: sbx policy init <balanced|deny-all|allow-all>"

  - id: policy-ls-balanced
    completes: check-policies
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO   SUMMARY"
        - "default-deny-all   local    all          network: deny when no rule decides"
        - "local-policy       local    all          network: 195 allow; filesystem read: 1 allow; filesystem write: 1 allow"

  # `sbx policy reset --force` (the non-interactive way) comes first: the plain
  # command below also matches when --force is present.
  - id: policy-reset-force
    when:
      command: [sbx, policy, reset]
      args:
        --force: true
    then:
      state:
        policy.stage: none
        policy.dockerAllowed: false
        policy.adsDenied: false
        rules.github: false
        rules.python: false
        rules.dockerhub: false
        rules.npm: false
      output:
        - "Restarting the daemon..."
        - { text: "✓ Policies reset. Pick a default with: sbx policy init <profile>", delay: medium }

  - id: policy-reset-interactive
    completes: reset-policy
    when:
      command: [sbx, policy, reset]
    then:
      state:
        policy.stage: locked
        policy.dockerAllowed: false
        policy.adsDenied: false
        rules.github: false
        rules.python: false
        rules.dockerhub: false
        rules.npm: false
      output:
        - "Restarting the daemon..."
        - { text: "✓ Policies reset.", delay: medium }
        - ""
        - "Choose a default network policy:"
        - "    Open         All traffic allowed"
        - "    Balanced     Default deny, with a broad allow-list"
        - "  ▸ Locked Down  Everything blocked until you allow it"
        - ""
        - "(In this simulation, Locked Down is selected for you.)"
        - "✓ Default policy: Locked Down"

  - id: policy-init-deny-all
    completes: reset-policy
    when:
      command: [sbx, policy, init]
      args:
        0: "deny-all"
    then:
      state: { policy.stage: locked }
      output: ["✓ Default policy: Locked Down (deny-all)"]

  - id: policy-init-balanced
    when:
      command: [sbx, policy, init]
      args:
        0: "balanced"
    then:
      state: { policy.stage: balanced }
      output: ["✓ Default policy: Balanced"]

  - id: policy-check-docker-allowed
    when:
      command: [sbx, policy, check, network]
      args:
        0: "docker.com"
      state: { policy.dockerAllowed: true }
    then:
      output:
        - "    Allowed:     docker.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Rule:        f652c735-f8f6-4a6b-9b9e-51ebc6d52545"

  - id: policy-check-docker-denied
    completes: check-denied
    when:
      command: [sbx, policy, check, network]
      args:
        0: "docker.com"
    then:
      output:
        - "    Denied:      docker.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Reason:      no matching allow rule (default deny)"

  - id: policy-check-github
    when:
      command: [sbx, policy, check, network]
      args:
        0: "api.github.com"
      state: { rules.github: true }
    then:
      output:
        - "    Allowed:     api.github.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Rule:        c2185734-ea42-4f5d-b083-a2266ca721a5"

  - id: policy-check-copilot
    when:
      command: [sbx, policy, check, network]
      args:
        0: "api.individual.githubcopilot.com"
      state: { rules.github: true }
    then:
      output:
        - "    Allowed:     api.individual.githubcopilot.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Rule:        b9b155c9-49aa-4131-96b1-bc2d7e2ac1b1"

  - id: policy-check-any
    when:
      command: [sbx, policy, check, network]
      args:
        0: { any: true }
    then:
      output:
        - "    Denied:      {{ args.0 }}:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Reason:      no matching allow rule (default deny)"

  # The allow rules. Each of the lab's four rules is matched by its exact host list.
  - id: policy-allow-docker
    completes: allow-host
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "docker.com"
    then:
      state: { policy.dockerAllowed: true }
      output:
        - "  Added rule f652c735-f8f6-4a6b-9b9e-51ebc6d52545 to policy local (scope: global): docker.com [tcp]"

  - id: policy-allow-github
    completes: allow-github
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "github.com,**.github.com,**.githubcopilot.com"
    then:
      state: { rules.github: true }
      output:
        - "  Added rule dda4bd8b-3f33-4d3b-97a8-b19796285f2c to policy local (scope: global): github.com [tcp]"
        - "  Added rule c2185734-ea42-4f5d-b083-a2266ca721a5 to policy local (scope: global): **.github.com [tcp]"
        - "  Added rule b9b155c9-49aa-4131-96b1-bc2d7e2ac1b1 to policy local (scope: global): **.githubcopilot.com [tcp]"

  - id: policy-allow-python
    completes: allow-python
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "deb.debian.org,dhi.io,pypi.org,files.pythonhosted.org"
    then:
      state: { rules.python: true }
      output:
        - "  Added rule ddbffc51-658f-4440-9b21-04fe6d64e05c to policy local (scope: global): deb.debian.org [tcp]"
        - "  Added rule 65162871-96bf-4d91-ac62-13790f32214d to policy local (scope: global): dhi.io [tcp]"
        - "  Added rule 49133bd8-43e7-4195-bb9e-59294b13a0df to policy local (scope: global): pypi.org [tcp]"
        - "  Added rule 5e799db9-4b4a-4ea0-9a46-912847ccb08c to policy local (scope: global): files.pythonhosted.org [tcp]"

  - id: policy-allow-docker-hub
    completes: allow-docker-hub
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "**.docker.io,production.cloudfront.docker.com"
    then:
      state: { rules.dockerhub: true }
      output:
        - "  Added rule 0f8cabf0-64bd-4c9d-aee6-d5d18d205f8f to policy local (scope: global): **.docker.io [tcp]"
        - "  Added rule e09d8452-9f1f-49a9-a8ed-09bf90606714 to policy local (scope: global): production.cloudfront.docker.com [tcp]"

  - id: policy-allow-npm
    completes: allow-npm
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "registry.npmjs.org"
    then:
      state: { rules.npm: true }
      output:
        - "  Added rule 9f487778-51f3-45e9-b154-0a75b3118ff3 to policy local (scope: global): registry.npmjs.org [tcp]"

  - id: policy-allow-any
    when:
      command: [sbx, policy, allow, network]
      args:
        0: { any: true }
    then:
      output:
        - "  Added rule 00adf6c6-bb88-40db-9bb3-c02e5578c665 to policy local (scope: global): {{ args.0 }} [tcp]"

  - id: policy-deny-any
    when:
      command: [sbx, policy, deny, network]
      args:
        0: { any: true }
    then:
      state: { policy.adsDenied: true }
      output:
        - "  Added rule 25ef9968-9e47-4a60-a2ba-febeb9bf6dc2 to policy local (scope: global): {{ args.0 }} [tcp,udp]"

  # The real command asks for confirmation: the simulation shows the question, answered y.
  - id: policy-rm-docker
    completes: remove-rules
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: "docker.com"
    then:
      state: { policy.dockerAllowed: false }
      output:
        - "  Remove network rules from global (resources=docker.com)? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources=docker.com"

  - id: policy-rm-ads
    completes: remove-rules
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: "ads.example.com"
    then:
      state: { policy.adsDenied: false }
      output:
        - "  Remove network rules from global (resources=ads.example.com)? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources=ads.example.com"

  - id: policy-rm-any
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: { any: true }
    then:
      output:
        - "  Remove network rules from global (resources={{ args.resource }})? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources={{ args.resource }}"

  # sbx policy log: one table per sandbox, abridged to the columns the lab needs.
  - id: policy-log-quickstart-paste
    when:
      command: [sbx, policy, log]
      args:
        0: "quickstart"
      state: { quickstart.pasteTried: true }
    then:
      output:
        - "  BLOCKED REQUESTS"
        - "  SANDBOX      TYPE      HOST           PROXY     REASON                                  COUNT"
        - "  quickstart   network   paste.rs:443   forward   No matching allow rule (default deny)   1"

  - id: policy-log-quickstart
    when:
      command: [sbx, policy, log]
      args:
        0: "quickstart"
    then:
      output: ["No requests recorded for sandbox 'quickstart' yet."]

  - id: policy-log-mcp-scanned
    completes: read-scan-log
    when:
      command: [sbx, policy, log]
      args:
        0: "mcp"
      state: { scan.done: true }
    then:
      output:
        - "  ALLOWED REQUESTS"
        - "  SANDBOX   HOST                                 ALLOWED BY               COUNT"
        - "  mcp       api.individual.githubcopilot.com     your rules               18"
        - "  mcp       api.github.com                       your rules + kit         24"
        - "  mcp       github.com                           your rules + kit         6"
        - "  mcp       codeload.github.com                  your rules + kit         2"
        - "  mcp       raw.githubusercontent.com            kit (this sandbox only)  3"
        - "  mcp       mirror.gcr.io                        kit (this sandbox only)  4"
        - "  mcp       index.docker.io                      your rules               4"
        - "  mcp       auth.docker.io                       your rules               4"
        - "  mcp       production.cloudfront.docker.com     your rules               9"
        - "  mcp       dhi.io                               your rules               8"
        - "  mcp       mcp-gateway.docker.internal          <daemon-managed alias>   6"
        - ""
        - "  BLOCKED REQUESTS"
        - "  SANDBOX   HOST               REASON                                  COUNT"
        - "  mcp       check.trivy.dev    No matching allow rule (default deny)   4"

  - id: policy-log-mcp
    completes: read-mcp-log
    when:
      command: [sbx, policy, log]
      args:
        0: "mcp"
    then:
      output:
        - "  ALLOWED REQUESTS"
        - "  SANDBOX   HOST                                 ALLOWED BY               COUNT"
        - "  mcp       api.individual.githubcopilot.com     your rules               18"
        - "  mcp       api.github.com                       your rules               11"
        - "  mcp       mcp-gateway.docker.internal          <daemon-managed alias>   6"
        - ""
        - "  (No request to the DHI server, and no network rule for it: the agent only"
        - "   talks to the gateway, which reaches the MCP server from outside the sandbox.)"

  - id: policy-log-shell
    when:
      command: [sbx, policy, log]
      args:
        0: false
      state: { shell.blocked: true }
    then:
      output:
        - "  BLOCKED REQUESTS"
        - "  SANDBOX     TYPE      HOST            PROXY     REASON                                  LAST SEEN        COUNT"
        - "  shell-demo  network   docker.com:80   forward   No matching allow rule (default deny)   11:03:48 7-Nov   2"

  - id: policy-log-empty
    when:
      command: [sbx, policy, log]
    then:
      output: ["No requests recorded yet."]

  # ════════════════════════════════════════════════════════════════════════
  # Module 01 (continued): a shell sandbox, to watch the proxy at work.
  # Inside a session, the lines you type are matched as agent prompts.
  # ════════════════════════════════════════════════════════════════════════

  - id: sbx-run-shell
    when:
      command: [sbx, run, shell]
      args:
        --name: "shell-demo"
    then:
      state: { sandboxes.shellDemo: true }
      output:
        - "Creating sandbox 'shell-demo' (workspace: /Users/you/sbx-lab)..."
        - { text: "✓ Sandbox ready", delay: pull }
      session:
        prompt: "agent@shell-demo:~$ "
        intro:
          - "You are now inside the sandbox 'shell-demo'. Your prompt is the sandbox's."
          - "In this simulation, leave it with /exit (in a real sandbox: exit)."
        outro:
          - "Back on your host."

  - id: sbx-run-shell-again
    when:
      command: [sbx, run]
      args:
        --name: "shell-demo"
      state: { sandboxes.shellDemo: true }
    then:
      session:
        prompt: "agent@shell-demo:~$ "
        intro:
          - "Reconnected to the sandbox 'shell-demo'. Leave it with /exit."
        outro:
          - "Back on your host."

  - id: shell-curl-allowed
    completes: shell-allowed
    when:
      agent: true
      promptContains: [curl, docker.com]
      state: { policy.dockerAllowed: true }
    then:
      output:
        - "HTTP/1.1 301 Moved Permanently"
        - "Location: https://docker.com/"
        - "Content-Length: 0"

  - id: shell-curl-blocked
    completes: shell-blocked
    when:
      agent: true
      promptContains: [curl, docker.com]
    then:
      state: { shell.blocked: true }
      output:
        - "Approval required for docker.com:80."
        - ""
        - "Review and respond with:"
        - "  sbx policy approval ls"

  # ════════════════════════════════════════════════════════════════════════
  # Module 02: kits
  # ════════════════════════════════════════════════════════════════════════

  - id: kit-inspect-copilot-yaml
    completes: inspect-copilot-kit
    when:
      command: [sbx, kit, inspect, sbx/copilot]
      args:
        --format: "yaml"
    then:
      output:
        - 'schemaVersion: "3"'
        - "kind: sandbox"
        - "name: copilot"
        - "displayName: GitHub Copilot"
        - "description: GitHub Copilot CLI, GitHub's agentic coding CLI."
        - "sourceURL: https://github.com/docker-hardened-images/definitions"
        - "licenses:"
        - "- LicenseRef-Proprietary"
        - "sandbox:"
        - "  image: docker.io/sbx/copilot@sha256:47db4edd..."
        - "  entrypoint:"
        - "  - copilot"
        - "  command:"
        - "    default:"
        - "    - --yolo"

  - id: kit-inspect-copilot
    completes: inspect-copilot-kit
    when:
      command: [sbx, kit, inspect, sbx/copilot]
    then:
      output:
        - "  Name:         copilot"
        - "  Kind:         sandbox"
        - "  Schema:       v3"
        - "  Display:      GitHub Copilot"
        - "  Description:  GitHub Copilot CLI, GitHub's agentic coding CLI."
        - "  Binary:       copilot"
        - "  Template:     docker.io/sbx/copilot@sha256:47db4edd..."
        - "  Run Options:  --yolo"
        - "  Policies:     none"

  - id: kit-inspect-claude
    completes: compare-claude-kit
    when:
      command: [sbx, kit, inspect, sbx/claude]
    then:
      output:
        - "  Name:         claude"
        - "  Kind:         sandbox"
        - "  Schema:       v3"
        - "  Display:      Claude Code"
        - "  Binary:       claude"
        - "  Arguments:    model, reasoningEffort"
        - "  Policies:"
        - "    Environment:  2 variables"
        - "  AI files:     /home/agent/.claude/CLAUDE.md"
        - ""
        - "(Abridged: the real output has more fields.)"

  - id: kit-validate-python
    completes: validate-python-kit
    when:
      command: [sbx, kit, validate, ./project/kits/python]
    then:
      output: ["  ✓ ./project/kits/python — valid (directory)"]

  - id: kit-inspect-python
    completes: inspect-python-kit
    when:
      command: [sbx, kit, inspect, ./project/kits/python]
    then:
      output:
        - "  Name:         python"
        - "  Kind:         mixin"
        - "  Schema:       v3"
        - "  Display:      Python"
        - "  Description:  Python 3 with venv and pip, installed when the sandbox is created"
        - "  Template:     sbx-kit-src:python-14804de38edb"
        - "  Policies:"
        - "    Network:    2 allow, 0 deny"
        - "    Commands:   1 install, 0 startup, 0 init files"

  # ════════════════════════════════════════════════════════════════════════
  # Module 03: secrets
  # ════════════════════════════════════════════════════════════════════════

  - id: secret-set-github
    completes: store-github-secret
    when:
      command: [sbx, secret, set, github]
    then:
      state: { secrets.github: true }
      output: ["✓ Secret 'github' stored in your OS keychain (global), read with: gh auth token"]

  - id: secret-set-copilot
    completes: store-copilot-secret
    when:
      command: [sbx, secret, set, copilot]
    then:
      state: { secrets.copilot: true }
      output: ["✓ Secret 'copilot' stored in your OS keychain (global), read with: gh auth token"]

  - id: secret-ls-both
    completes: list-secrets
    when:
      command: [sbx, secret, ls]
      state:
        secrets.github: true
        secrets.copilot: true
    then:
      output:
        - "SCOPE      TYPE      NAME      SECRET"
        - "(global)   service   github    (stored)"
        - "(global)   service   copilot   (stored)"

  - id: secret-ls-github
    when:
      command: [sbx, secret, ls]
      state: { secrets.github: true }
    then:
      output:
        - "SCOPE      TYPE      NAME      SECRET"
        - "(global)   service   github    (stored)"

  - id: secret-ls-copilot
    when:
      command: [sbx, secret, ls]
      state: { secrets.copilot: true }
    then:
      output:
        - "SCOPE      TYPE      NAME      SECRET"
        - "(global)   service   copilot   (stored)"

  - id: secret-ls-none
    when:
      command: [sbx, secret, ls]
    then:
      output: ["No secrets stored."]

  # ════════════════════════════════════════════════════════════════════════
  # Module 04: your agent's sandbox
  # ════════════════════════════════════════════════════════════════════════

  # The kit paths in the lab are relative to project/, so creating from the
  # repository root fails: a common mistake worth reproducing.
  - id: create-wrong-dir
    when:
      command: [sbx, create, copilot]
      args:
        --kit: { oneOf: ["./kits/python", "./kits/trivy", "./kits/api-port"] }
      state: { cwd: root }
    then:
      stderr:
        - "Error: kit './kits/python' not found."
        - "Run this command from the project directory: cd project"
      exit: 1

  - id: create-quickstart-exists
    when:
      command: [sbx, create, copilot]
      args:
        --name: "quickstart"
      state: { sandboxes.quickstart: true }
    then:
      stderr:
        - 'Error: sandbox "quickstart" already exists. Remove it with: sbx rm quickstart'
      exit: 1

  - id: create-quickstart
    completes: create-sandbox
    when:
      command: [sbx, create, copilot]
      args:
        --name: "quickstart"
    then:
      state: { sandboxes.quickstart: true }
      output:
        - "  ○ copilot — now ships as a kit; resolving docker.io/sbx/copilot:latest"
        - ""
        - "SANDBOX"
        - "  Name:       quickstart"
        - "  Agent:      copilot"
        - "  Kits:       docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
        - "              ./kits/python"
        - "  Workspace:  ~/sbx-lab/project (rw)"
        - "  Skills:     0 entries · linked, read-only"
        - "    Source:   ~/Library/Application Support/com.docker.sandboxes/sandboxes/agent-skills"
        - "    Target:   /home/agent/.copilot/skills"
        - "  Image:      docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
        - "  CPU:        8"
        - "  Memory:     16 GiB"
        - ""
        - "IMAGE"
        - { text: "  ✓ image — ready", delay: pull }
        - ""
        - "AGENT"
        - "    assembling kit image from 2 kits"
        - "    loading kit image docker.io/sbx/copilot@sha256:47db4edda6a46b4c9fec0218994c013c4e713a73bc5151c9b3f7693464abedca"
        - "    loading kit image ~/sbx-lab/project/kits/python"
        - "  ✓ assembled kit image (3 layers)"
        - "    setting 2 environment variables"
        - "      +COPILOT_GITHUB_TOKEN +GH_TOKEN"
        - "    running 3 install commands"
        - "      $ Ensure .copilot is owned by agent before bind mounts and th… (kit=copilot, user=0)"
        - "      ✓ Ensure .copilot is owned by agent before bind mounts and th… (kit=copilot, user=0, 5ms)"
        - "      $ Copilot config with trusted workspace folder (kit=copilot, user=agent)"
        - "      ✓ Copilot config with trusted workspace folder (kit=copilot, user=agent, 6ms)"
        - "      $ Install Python 3, venv and pip (kit=python, user=0)"
        - { text: "      ✓ Install Python 3, venv and pip (kit=python, user=0, 6.1s)", delay: pull }
        - "      view install logs: ls /var/log/sbx-kits"
        - "    registering 1 startup command, run on every container start"
        - "      ○ Register the sandbox MCP gateway in ~/.copilot/mcp-config.j… (kit=copilot, user=agent)"
        - "      view startup log: cat /var/log/sbx-kit-startup.log"
        - ""
        - "  ✓ Created sandbox quickstart"
        - "      try: sbx run --name quickstart"

  - id: create-mcp-no-server
    when:
      command: [sbx, create, copilot]
      args:
        --static-mcp: "dhi"
      state: { mcp.registered: false }
    then:
      stderr:
        - "Error: MCP server 'dhi' is not registered. Register it first: sbx mcp add dhi --url https://dhi.io/mcp"
      exit: 1

  - id: create-mcp-exists
    when:
      command: [sbx, create, copilot]
      args:
        --name: "mcp"
      state: { sandboxes.mcp: true }
    then:
      stderr:
        - 'Error: sandbox "mcp" already exists. Remove it with: sbx rm mcp'
      exit: 1

  - id: create-mcp
    completes: create-mcp-sandbox
    when:
      command: [sbx, create, copilot]
      args:
        --name: "mcp"
        --static-mcp: "dhi"
