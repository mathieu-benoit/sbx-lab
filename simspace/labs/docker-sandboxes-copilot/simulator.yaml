  - id: git-merge-notif
    completes: merge-agents
    when:
      command: [git, merge]
      args:
        --no-edit: "sandbox-add-notif/main"
      state:
        repo.notifFetched: true
        repo.mergedNotif: false
    then:
      files:
        - create: "project/backend/app/services/notifications.py"
          content: |
            """Notification service for DevBoard: email the people involved when a status changes."""

            import asyncio
            import logging
            import os
            import smtplib
            from email.message import EmailMessage
            from typing import Optional

            logger = logging.getLogger(__name__)


            def _send(host: str, port: int, user: str, password: str, message: EmailMessage) -> None:
                with smtplib.SMTP(host, port) as smtp:
                    smtp.starttls()
                    smtp.login(user, password)
                    smtp.send_message(message)


            async def send_status_change_notification(
                issue_id: int,
                issue_title: str,
                old_status: str,
                new_status: str,
                assignee_email: Optional[str] = None,
                reporter_email: Optional[str] = None,
                project_id: Optional[int] = None,
            ) -> None:
                host = os.getenv("SMTP_HOST")
                user = os.getenv("SMTP_USER")
                password = os.getenv("SMTP_PASS")
                if not (host and user and password):
                    logger.warning("SMTP is not configured: skipping the notification for issue #%d", issue_id)
                    return

                recipients = {email for email in (reporter_email, assignee_email) if email}
                if not recipients:
                    return

                frontend = os.getenv("FRONTEND_URL", "http://localhost:3000")
                message = EmailMessage()
                message["Subject"] = f"[DevBoard] Issue #{issue_id} moved to {new_status}"
                message["From"] = user
                message["To"] = ", ".join(sorted(recipients))
                message.set_content(
                    f"'{issue_title}' moved from {old_status} to {new_status}.\n"
                    f"{frontend}/projects/{project_id}\n"
                )
                try:
                    port = int(os.getenv("SMTP_PORT", "587"))
                    await asyncio.to_thread(_send, host, port, user, password, message)
                except Exception:
                    logger.exception("Could not send the notification for issue #%d", issue_id)
        - create: "project/backend/tests/test_notifications.py"
          content: |
            import asyncio
            from unittest.mock import MagicMock, patch

            from app.services.notifications import send_status_change_notification


            def _run(**kwargs):
                return asyncio.run(
                    send_status_change_notification(1, "Login page crashes", "open", "done", **kwargs)
                )


            def test_sends_email_to_reporter_and_assignee(monkeypatch):
                for key, value in {"SMTP_HOST": "smtp.test", "SMTP_USER": "bot", "SMTP_PASS": "pw"}.items():
                    monkeypatch.setenv(key, value)
                with patch("smtplib.SMTP") as smtp:
                    _run(assignee_email="a@example.com", reporter_email="r@example.com", project_id=7)
                smtp.return_value.__enter__.return_value.send_message.assert_called_once()


            def test_nothing_is_sent_without_smtp_configuration(monkeypatch):
                monkeypatch.delenv("SMTP_HOST", raising=False)
                with patch("smtplib.SMTP") as smtp:
                    _run(reporter_email="r@example.com")
                smtp.assert_not_called()


            def test_smtp_failure_does_not_break_the_call(monkeypatch):
                for key, value in {"SMTP_HOST": "smtp.test", "SMTP_USER": "bot", "SMTP_PASS": "pw"}.items():
                    monkeypatch.setenv(key, value)
                with patch("smtplib.SMTP", side_effect=OSError("boom")):
                    _run(reporter_email="r@example.com")
      state: { repo.mergedNotif: true }
      output:
        - "Merge made by the 'ort' strategy."
        - " project/backend/app/services/notifications.py | 52 +++++++++++++++++++++-----"
        - " project/backend/tests/test_notifications.py   | 58 ++++++++++++++++++++++++++++"
        - " project/backend/app/routers/issues.py         |  4 ++-"
        - " 3 files changed, 98 insertions(+), 16 deletions(-)"

