  - id: git-status-dirty
    when:
      command: [git, status]
      state:
        code.paginationFixed: true
        repo.paginationCommitted: false
    then:
      output:
        - "On branch main"
        - "Changes not staged for commit:"
        - "  (use \"git add <file>...\" to update what will be committed)"
        - "        modified:   project/backend/app/routers/issues.py"
        - ""
        - "no changes added to commit (use \"git add\" and/or \"git commit -a\")"

  - id: git-status-clean
    when:
      command: [git, status]
    then:
      output:
        - "On branch main"
        - "nothing to commit, working tree clean"

  - id: git-diff-pagination
    when:
      command: [git, diff]
      args:
        0: false
      state:
        code.paginationFixed: true
        repo.paginationCommitted: false
    then:
      output:
        - "diff --git a/project/backend/app/routers/issues.py b/project/backend/app/routers/issues.py"
        - "--- a/project/backend/app/routers/issues.py"
        - "+++ b/project/backend/app/routers/issues.py"
        - "@@ -69,7 +69,7 @@ def list_issues("
        - "     total = query.count()"
        - " "
        - "-    skip = page * page_size"
        - "+    skip = (page - 1) * page_size"
        - "     items = query.order_by(models.Issue.created_at.desc()).offset(skip).limit(page_size).all()"

  - id: git-diff-search-stat
    when:
      command: [git, diff, HEAD...sandbox-add-search/main]
    then:
      output:
        - " project/backend/app/routers/issues.py | 12 ++++++++++--"
        - " project/backend/tests/test_issues.py  |  4 ----"
        - " 2 files changed, 10 insertions(+), 6 deletions(-)"

  - id: git-diff-notif-stat
    when:
      command: [git, diff, HEAD...sandbox-add-notif/main]
    then:
      output:
        - " project/backend/app/services/notifications.py | 52 +++++++++++++++++++++-----"
        - " project/backend/tests/test_notifications.py   | 58 ++++++++++++++++++++++++++++"
        - " project/backend/app/routers/issues.py         |  4 ++-"
        - " 3 files changed, 98 insertions(+), 16 deletions(-)"

  - id: git-diff-clean
    when:
      command: [git, diff]
    then:
      output: []

  - id: git-add
    when:
      command: [git, add]
    then:
      output: []

  - id: git-commit-pagination
    completes: commit-fix
    when:
      command: [git, commit]
      state:
        code.paginationFixed: true
        repo.paginationCommitted: false
    then:
      state: { repo.paginationCommitted: true }
      output:
        - "[main a4c91d2] Fix pagination offset in list_issues"
        - " 1 file changed, 1 insertion(+), 1 deletion(-)"

  - id: git-commit-nothing
    when:
      command: [git, commit]
    then:
      output:
        - "On branch main"
        - "nothing to commit, working tree clean"
      exit: 1

