version: "2.0"

metadata:
  id: docker-sandboxes-copilot
  title: "Docker Sandboxes with GitHub Copilot"
  summary: "Network policies, kits, credentials, direct and clone mode, Docker in the sandbox, port forwarding and MCP, simulated in the browser."

objectives:
  - "Control what an agent can reach with network policies"
  - "Read and build kits"
  - "Give an agent credentials it can use but never read"
  - "Run agents in direct mode, in clone mode and in parallel"
  - "Run Docker inside a sandbox and publish its ports"
  - "Give an agent tools through the MCP gateway"
  - "Run the same agent in a cloud sandbox"

# In-memory state. Every scenario below reads it in `when.state` and writes it
# in `then.state`; it is the whole "where am I in the lab" model.
state:
  cwd: root                   # root of the repository, or project
  policy:
    stage: balanced           # balanced -> none (after reset) -> locked (after init deny-all)
    dockerAllowed: false      # the docker.com allow rule from the network module
    adsDenied: false
  secrets:
    github: false
    copilot: false
  sandboxes:
    shellDemo: false
    quickstart: false
    fixBugs: false
    addSearch: false
    addNotif: false
    mcp: false
    portsDemo: false
  shell:
    blocked: false            # shell-demo hit the proxy
  quickstart:
    pasteTried: false
  repo:                       # what is in YOUR repository on the host
    paginationCommitted: false
    fixFetched: false
    searchFetched: false
    notifFetched: false
    mergedFix: false
    mergedSearch: false
    mergedNotif: false
  code:
    paginationFixed: false    # the working tree has the pagination fix
  clone:
    fixDone: false            # the fix-bugs agent finished
  stack:
    up: false                 # Docker Compose stack running inside quickstart
  ports:
    api: false
    web: false
    demoServer: false
  mcp:
    registered: false
  scan:
    done: false
  cloud:                      # module 11, in the cloud backend
    secret: false
    sandbox: false
    stopped: false
    dockerAllowed: false
    copied: false
    apiUp: false
    port: false
    report: false
    local: false              # devboard-local, the copy sbx move brought to your machine

settings:
  pace:
    pull: 900       # a layer download or an image build step
    scan: 1100      # a Trivy scan
    work: 700       # an agent doing something

defaults:
  unmatched:
    stderr: ["This command isn't part of the lab: the simulation only knows the commands the modules ask you to run."]
    exit: 127
  unmatchedAgent:
    output: ["This prompt isn't part of the lab. Use the Run button on the prompts of the module, or type /exit to leave the session."]

scenarios:
  # ════════════════════════════════════════════════════════════════════════
  # Module 11: cloud sandboxes
  # `--cloud` takes the verb that follows it as its value (the flag parser is
  # greedy), so `sbx --cloud ls` arrives as `sbx` with `--cloud: ls`, and the
  # remaining words are the positionals: `sbx --cloud secret set github` is
  # command [sbx, set, github]. They come first: they only match with `--cloud`, and
  # local scenarios such as [sbx, ls] or the TUI's bare [sbx] would take them.
  # ════════════════════════════════════════════════════════════════════════

  - id: cloud-diagnose
    completes: cloud-diagnose
    when:
      command: [sbx]
      args: { --cloud: "diagnose" }
    then:
      output:
        - ""
        - "INSTALLATION"
        - "  ✓ CLI binary — found"
        - ""
        - "CONNECTION"
        - "  ✓ Authentication — authenticated"
        - "  ✓ Cloud API — reachable"
        - "      https://api.sandboxes-cloud.docker.com"
        - "  ✓ Cloud entitlement — subscribed"
        - ""
        - "  5 passed"

  - id: cloud-ls-running
    when:
      command: [sbx]
      args: { --cloud: "ls" }
      state: { cloud.sandbox: true, cloud.stopped: false }
    then:
      output:
        - "SANDBOX                  AGENT     ID                                STATUS      WORKSPACE"
        - "copilot/devboard-cloud   copilot   sbx_01jcloudlab7x4k2m9qv3t8hz5r   ● running   -"

  - id: cloud-ls-stopped
    when:
      command: [sbx]
      args: { --cloud: "ls" }
      state: { cloud.sandbox: true, cloud.stopped: true }
    then:
      output:
        - "SANDBOX                  AGENT     ID                                STATUS      WORKSPACE"
        - "copilot/devboard-cloud   copilot   sbx_01jcloudlab7x4k2m9qv3t8hz5r   ○ stopped   -"

  - id: cloud-ls-empty
    when:
      command: [sbx]
      args: { --cloud: "ls" }
    then:
      output: ["No sandboxes found"]

  - id: cloud-secret-set-github
    completes: cloud-secret
    when:
      command: [sbx, set, github]
      args: { --cloud: "secret" }
    then:
      state: { cloud.secret: true }
      output:
        - "Enter the token for github: ********"
        - "✓ Stored cloud secret github (global)"

  - id: cloud-secret-ls
    when:
      command: [sbx, ls]
      args: { --cloud: "secret" }
      state: { cloud.secret: true }
    then:
      output:
        - "SCOPE      SERVICE   TYPE    SECRET   CREATED"
        - "(global)   github    token   ***      5s"

  - id: cloud-secret-ls-empty
    when:
      command: [sbx, ls]
      args: { --cloud: "secret" }
    then:
      output: ["No secrets found"]

  - id: cloud-secret-rm-github
    when:
      command: [sbx, rm, github]
      args: { --cloud: "secret" }
    then:
      state: { cloud.secret: false }
      output: ["Removed cloud secret github"]

  - id: cloud-create
    completes: cloud-create
    when:
      command: [sbx, copilot]
      args:
        --cloud: "create"
        --name: "devboard-cloud"
    then:
      state: { cloud.sandbox: true, cloud.stopped: false }
      output:
        - "  ○ copilot — now ships as a kit; resolving docker.io/sbx/copilot:latest"
        - "    assembling kit image from 2 kits"
        - { text: "  ✓ assembled kit image", delay: pull }
        - "      Uploading to cloud..."
        - { text: "      Preparing template...", delay: pull }
        - "      Template ready."
        - "  ✓ kit image — ready as template tmpl_01jcloudtmpl5n8w2c4r6y0d3k"
        - "warning: kit credentials for github, copilot are not routed when launching an uploaded or imported kit image; the sandbox starts without them"
        - ""
        - "SANDBOX"
        - "  Name:      devboard-cloud"
        - "  Agent:     copilot"
        - "  Template:  tmpl_01jcloudtmpl5n8w2c4r6y0d3k"
        - { text: "  ✓ created sandbox (5s)", delay: work }
        - "      Applying kit \"copilot\" to sandbox sbx_01jcloudlab7x4k2m9qv3t8hz5r ..."
        - { text: "  ✓ configured agent (12s)", delay: work }
        - ""
        - "  ✓ Created sandbox copilot/devboard-cloud (sbx_01jcloudlab7x4k2m9qv3t8hz5r, template tmpl_01jcloudtmpl5n8w2c4r6y0d3k)"

  - id: cloud-inspect
    when:
      command: [sbx, devboard-cloud]
      args: { --cloud: "inspect" }
      state: { cloud.sandbox: true }
    then:
      output:
        - "  ID:           sbx_01jcloudlab7x4k2m9qv3t8hz5r"
        - "  Name:         copilot/devboard-cloud"
        - "  Agent:        copilot"
        - "  State:        running (created 18s ago)"
        - "  CPUs:         2"
        - "  Memory:       4096 MiB"
        - "  On timeout:   stop"
        - "  Auto-resume:  enabled"
        - "  Ports:        none published"
        - "  Expires:      59m"

  # `sbx --cloud exec devboard-cloud …`: the remaining words follow the sandbox
  # name. Once the agent started the API, `sh -c` is the test report.
  - id: cloud-exec-report
    when:
      command: [sbx, devboard-cloud, sh]
      args: { --cloud: "exec" }
      state: { cloud.sandbox: true, cloud.apiUp: true }
    then:
      state: { cloud.report: true }

  - id: cloud-exec-check
    when:
      command: [sbx, devboard-cloud, sh]
      args: { --cloud: "exec" }
      state: { cloud.sandbox: true }
    then:
      output:
        - "Python 3.13.5"
        - "GH_TOKEN=gho_sbxproxymanaged000000000000000000000"
        - "COPILOT_GITHUB_TOKEN=proxy-managed"

  - id: cloud-exec-curl-allowed
    when:
      command: [sbx, devboard-cloud, curl]
      args: { --cloud: "exec" }
      state: { cloud.sandbox: true, cloud.dockerAllowed: true }
    then:
      output: ["301"]

  - id: cloud-exec-curl-blocked
    when:
      command: [sbx, devboard-cloud, curl]
      args: { --cloud: "exec" }
      state: { cloud.sandbox: true }
    then:
      stderr: ["curl: (56) CONNECT tunnel failed, response 403"]
      exit: 56

  # `sbx --cloud policy ls` with no sandbox: the account's policy.
  - id: cloud-policy-ls-account
    when:
      command: [sbx, ls]
      args: { --cloud: "policy", 0: false }
    then:
      output:
        - "  Default:  deny-all"
        - "No allow or deny rules"

  - id: cloud-policy-init-deny-all
    completes: cloud-init
    when:
      command: [sbx, init, deny-all]
      args: { --cloud: "policy" }
    then:
      output:
        - "  Default:  deny-all"
        - "No allow or deny rules"

  - id: cloud-policy-ls
    when:
      command: [sbx, ls, devboard-cloud]
      args: { --cloud: "policy" }
      state: { cloud.sandbox: true }
    then:
      output:
        - "  Default:  deny-all"
        - "DECISION   NETWORK"
        - "allow      api.business.githubcopilot.com:443"
        - "allow      api.enterprise.githubcopilot.com:443"
        - "allow      api.github.com:443"
        - "allow      api.githubcopilot.com:443"
        - "allow      api.individual.githubcopilot.com:443"
        - "allow      copilot.github.com:443"
        - "allow      release-assets.githubusercontent.com:443"
        - "allow      deb.debian.org:80"
        - "allow      dhi.io:80"
        - "allow      pypi.org:443"
        - "allow      files.pythonhosted.org:443"
        - "allow      **.docker.io:443"
        - "allow      production.cloudfront.docker.com:443"
        - "allow      dhi.io:443"
        - "allow      registry.npmjs.org:443"

  - id: cloud-policy-allow-docker
    completes: cloud-allow
    when:
      command: [sbx, allow, network, "docker.com:443"]
      args:
        --cloud: "policy"
        --sandbox: "devboard-cloud"
      state: { cloud.sandbox: true }
    then:
      state: { cloud.dockerAllowed: true }
      output: ["Allowed network docker.com:443"]

  - id: cloud-policy-rm-docker
    when:
      command: [sbx, rm, network]
      args:
        --cloud: "policy"
        --sandbox: "devboard-cloud"
      state: { cloud.sandbox: true }
    then:
      state: { cloud.dockerAllowed: false }
      output: ["Removed allow rule docker.com:443"]

  - id: cloud-cp-backend
    completes: cloud-copy
    when:
      command: [sbx, ./backend]
      args: { --cloud: "cp" }
      state: { cloud.sandbox: true }
    then:
      state: { cloud.copied: true }
      output:
        - "  ○ uploading ./backend"
        - { text: "Uploaded 79 files from ./backend", delay: work }

  - id: cloud-cp-report
    completes: cloud-copy-back
    when:
      command: [sbx, "devboard-cloud:/home/agent/workspace/backend/test-report.txt"]
      args: { --cloud: "cp" }
      state: { cloud.report: true }
    then:
      output:
        - "  ○ downloading sbx_01jcloudlab7x4k2m9qv3t8hz5r:/home/agent/workspace/backend/test-report.txt"
        - "Copied sbx_01jcloudlab7x4k2m9qv3t8hz5r:/home/agent/workspace/backend/test-report.txt to ./test-report.txt"

  - id: cloud-attach
    when:
      command: [sbx, devboard-cloud]
      args: { --cloud: "attach" }
      state: { cloud.sandbox: true }
    then:
      state: { cloud.stopped: false }
      output:
        - "Attaching to cloud sandbox devboard-cloud..."
      session:
        prompt: "copilot (devboard-cloud)> "
        intro:
          - "GitHub Copilot CLI (scripted) · cloud sandbox 'devboard-cloud' · no workspace mount"
          - "Running with --yolo. Type /exit to leave (in the real lab, Ctrl+\\ detaches and the agent keeps running)."
        outro:
          - "Detached. The cloud sandbox keeps running: sbx --cloud attach devboard-cloud joins it again."

  - id: agent-cloud-api
    completes: cloud-agent
    when:
      agent: true
      promptContains: [listening on 0.0.0.0:8000]
    then:
      state: { cloud.apiUp: true }
      output:
        - { text: "● $ python3 -m venv ~/venv && ~/venv/bin/pip install -q -r backend/requirements.txt", delay: work }
        - { text: "● $ cd backend && ~/venv/bin/pytest -q", delay: work }
        - "    20 passed"
        - "● $ cd backend && DATABASE_URL=sqlite:///./devboard.db nohup ~/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 &"
        - { text: "● $ curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8000/docs", delay: work }
        - "    200"
        - ""
        - "The virtual environment is in ~/venv, all 20 tests pass, and the API is running in the background on 0.0.0.0:8000 with SQLite: /docs answers 200."

  - id: cloud-port-publish
    completes: cloud-publish
    when:
      command: [sbx, publish, devboard-cloud, "8000"]
      args: { --cloud: "port" }
      state: { cloud.sandbox: true }
    then:
      state: { cloud.port: true }
      output: ["Port 8000 exposed at https://8000-01jcloudlab7x4k2m9qv3t8hz5r.sbx.sandboxes-cloud.docker.com"]

  - id: cloud-port-unpublish
    when:
      command: [sbx, unpublish, devboard-cloud, "8000"]
      args: { --cloud: "port" }
    then:
      state: { cloud.port: false }
      output: ["Port 8000 removed"]

  # curl stands in for the browser. A stopped sandbox wakes up on the request.
  - id: cloud-url-wakes
    when:
      command: [curl]
      args:
        0: "https://8000-01jcloudlab7x4k2m9qv3t8hz5r.sbx.sandboxes-cloud.docker.com/health"
      state: { cloud.port: true, cloud.apiUp: true, cloud.stopped: true }
    then:
      state: { cloud.stopped: false }
      output:
        - { text: '{"status":"ok"}', delay: work }
        - ""
        - "(The sandbox was stopped: this request woke it up. sbx --cloud ls shows it running again.)"

  - id: cloud-url
    when:
      command: [curl]
      args:
        0: "https://8000-01jcloudlab7x4k2m9qv3t8hz5r.sbx.sandboxes-cloud.docker.com/health"
      state: { cloud.port: true, cloud.apiUp: true }
    then:
      output: ['{"status":"ok"}']

  - id: cloud-ttl-extend
    completes: cloud-ttl
    when:
      command: [sbx, "+30m", devboard-cloud]
      args: { --cloud: "ttl" }
      state: { cloud.sandbox: true }
    then:
      output:
        - "Extended TTL"
        - "Expires in 1h29m (MAX remaining: 23h58m)."

  - id: cloud-ttl
    when:
      command: [sbx, devboard-cloud]
      args: { --cloud: "ttl" }
      state: { cloud.sandbox: true }
    then:
      output:
        - "Expires in 59m (MAX remaining: 23h59m)."

  - id: cloud-stop
    when:
      command: [sbx, devboard-cloud]
      args: { --cloud: "stop" }
      state: { cloud.sandbox: true }
    then:
      state: { cloud.stopped: true }
      output:
        - "  ○ stopping sandbox devboard-cloud"
        - "Stopping sandbox devboard-cloud"

  # `sbx move` has no --cloud: it spans both backends.
  - id: cloud-move-to-local
    completes: cloud-move
    when:
      command: [sbx, move, devboard-cloud]
      args:
        --to: "local"
        --name: "devboard-local"
      state: { cloud.sandbox: true }
    then:
      state: { cloud.local: true, cloud.stopped: true }
      output:
        - "Moving sandbox sbx_01jcloudlab7x4k2m9qv3t8hz5r to this machine:"
        - "  - Its files stay inside the sandbox at the image's working directory;"
        - "    no local folder is mounted. Copy files out with 'sbx cp'."
        - "  - Its cloud network policy does not carry over; the local sandbox starts with this"
        - "    machine's default egress policy."
        - "  - Published ports are saved for local use. Loopback bindings exist only while the"
        - "    sandbox runs, and host ports may change when it starts. Cloud URLs do not carry over."
        - "  - Attached volumes and environment variables do not carry over."
        - "warning: Secrets managed by sbx are not copied. The destination may use its own secrets; you may need to sign in again."
        - "warning: Credentials saved in copied files can still travel with the sandbox."
        - "Continue? [y/N] y   (simulated)"
        - "○ moving sandbox devboard-cloud to local"
        - "    Pulling sandbox sbx_01jcloudlab7x4k2m9qv3t8hz5r to local ..."
        - { text: "    Download complete.", delay: pull }
        - "  ✓ port 8000/tcp — published 127.0.0.1:60000"
        - ""
        - "  ✓ Created sandbox devboard-local"
        - "    Stopping cloud sandbox sbx_01jcloudlab7x4k2m9qv3t8hz5r ..."
        - "    Stop accepted for cloud source sandbox sbx_01jcloudlab7x4k2m9qv3t8hz5r; the stop continues in the background. Check it with `sbx --cloud ls`."
        - "Moved to local sandbox devboard-local"
        - "  Files:        inside the sandbox at the image's working directory (no local folder is mounted)"
        - "  Attach with:  sbx run --name devboard-local"

  - id: cloud-local-exec
    when:
      command: [sbx, exec, devboard-local, sh]
      state: { cloud.local: true }
    then:
      output:
        - "Dockerfile"
        - "app"
        - "pytest.ini"
        - "requirements.txt"
        - "tests"
        - "0.162.4"
        - "GH_TOKEN=proxy-managed"
        - "COPILOT_GITHUB_TOKEN=proxy-managed"

  - id: cloud-local-rm
    when:
      command: [sbx, rm]
      args:
        --force: "devboard-local"
      state: { cloud.local: true }
    then:
      state: { cloud.local: false }
      output: ["✓ Removed sandbox 'devboard-local'"]

  - id: cloud-rm
    completes: cloud-rm
    when:
      command: [sbx, devboard-cloud]
      args: { --cloud: "rm" }
      state: { cloud.sandbox: true }
    then:
      state:
        cloud.sandbox: false
        cloud.stopped: false
        cloud.port: false
        cloud.apiUp: false
        cloud.copied: false
        cloud.report: false
      output:
        - "  ○ removing sandbox devboard-cloud"
        - "Removed sandbox devboard-cloud"

  # ════════════════════════════════════════════════════════════════════════
  # Plain shell on your host: cd and gh
  # ════════════════════════════════════════════════════════════════════════

  - id: cd-project
    when:
      command: [cd]
      args:
        0: "project"
    then:
      state: { cwd: project }

  - id: cd-up
    when:
      command: [cd]
      args:
        0: ".."
    then:
      state: { cwd: root }

  # Inside a session the terminal handles /exit itself; this is the answer when
  # you type it at a plain host prompt.
  - id: exit-without-session
    when:
      command: ["/exit"]
    then:
      output: ["No agent session is open in this terminal."]

  - id: gh-auth-status
    when:
      command: [gh, auth, status]
    then:
      output:
        - "github.com"
        - "  ✓ Logged in to github.com account your-github-login (keyring)"
        - "  - Active account: true"
        - "  - Git operations protocol: https"
        - "  - Token: gho_************************************"

  # ════════════════════════════════════════════════════════════════════════
  # Module 01: network policies
  # sbx policy ls shows a different table depending on how far you got.
  # ════════════════════════════════════════════════════════════════════════

  - id: policy-ls-lab-mcp
    when:
      command: [sbx, policy, ls]
      state:
        policy.stage: locked
        sandboxes.mcp: true
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO           SUMMARY"
        - "default-deny-all   local    all                  network: deny when no rule decides"
        - "local-policy       local    all                  filesystem read: 1 allow; filesystem write: 1 allow"
        - "kit-quickstart     kit      sandbox:quickstart   network: the Copilot hosts, plus the DevBoard kit's"
        - "kit-dhi            kit      sandbox:dhi          network: the Copilot hosts, plus the DevBoard, Trivy and Scout kits'"

  - id: policy-ls-lab-quickstart
    when:
      command: [sbx, policy, ls]
      state:
        policy.stage: locked
        sandboxes.quickstart: true
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO           SUMMARY"
        - "default-deny-all   local    all                  network: deny when no rule decides"
        - "local-policy       local    all                  filesystem read: 1 allow; filesystem write: 1 allow"
        - "kit-quickstart     kit      sandbox:quickstart   network: the Copilot hosts, plus the DevBoard kit's"

  - id: policy-ls-locked
    when:
      command: [sbx, policy, ls]
      state: { policy.stage: locked }
    then:
      output:
        - "  POLICY             SOURCE   APPLIES TO   SUMMARY"
        - "  default-deny-all   local    all          network: deny when no rule decides"
        - "  local-policy       local    all          filesystem read: 1 allow; filesystem write: 1 allow"

  - id: policy-ls-none
    when:
      command: [sbx, policy, ls]
      state: { policy.stage: none }
    then:
      output:
        - "No policies configured. Choose a default with: sbx policy init <balanced|deny-all|allow-all>"

  - id: policy-ls-balanced
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "POLICY             SOURCE   APPLIES TO   SUMMARY"
        - "default-deny-all   local    all          network: deny when no rule decides"
        - "local-policy       local    all          network: 195 allow; filesystem read: 1 allow; filesystem write: 1 allow"

  # `sbx policy reset --force` (the non-interactive way) comes first: the plain
  # command below also matches when --force is present.
  - id: policy-reset-force
    when:
      command: [sbx, policy, reset]
      args:
        --force: true
    then:
      state:
        policy.stage: none
        policy.dockerAllowed: false
        policy.adsDenied: false
      output:
        - "Restarting the daemon..."
        - { text: "✓ Policies reset. Pick a default with: sbx policy init <profile>", delay: medium }

  - id: policy-reset-interactive
    completes: reset-policy
    when:
      command: [sbx, policy, reset]
    then:
      state:
        policy.stage: locked
        policy.dockerAllowed: false
        policy.adsDenied: false
      output:
        - "Restarting the daemon..."
        - { text: "✓ Policies reset.", delay: medium }
        - ""
        - "Choose a default network policy:"
        - "    Open         All traffic allowed"
        - "    Balanced     Default deny, with a broad allow-list"
        - "  ▸ Locked Down  Everything blocked until you allow it"
        - ""
        - "(In this simulation, Locked Down is selected for you.)"
        - "✓ Default policy: Locked Down"

  - id: policy-init-deny-all
    completes: reset-policy
    when:
      command: [sbx, policy, init]
      args:
        0: "deny-all"
    then:
      state: { policy.stage: locked }
      output: ["✓ Default policy: Locked Down (deny-all)"]

  - id: policy-init-balanced
    when:
      command: [sbx, policy, init]
      args:
        0: "balanced"
    then:
      state: { policy.stage: balanced }
      output: ["✓ Default policy: Balanced"]

  - id: policy-check-docker-allowed
    when:
      command: [sbx, policy, check, network]
      args:
        0: "docker.com"
      state: { policy.dockerAllowed: true }
    then:
      output:
        - "    Allowed:     docker.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Rule:        f652c735-f8f6-4a6b-9b9e-51ebc6d52545"

  - id: policy-check-docker-denied
    completes: check-denied
    when:
      command: [sbx, policy, check, network]
      args:
        0: "docker.com"
    then:
      output:
        - "    Denied:      docker.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Reason:      no matching allow rule (default deny)"

  - id: policy-check-github
    completes: verify-rules
    when:
      command: [sbx, policy, check, network]
      args:
        0: "api.github.com"
    then:
      output:
        - "    Denied:      api.github.com:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Reason:      no matching allow rule (default deny)"

  - id: policy-check-any
    when:
      command: [sbx, policy, check, network]
      args:
        0: { any: true }
    then:
      output:
        - "    Denied:      {{ args.0 }}:443"
        - "    Governance:  Local policy only"
        - "    Context:     global"
        - "    Reason:      no matching allow rule (default deny)"

  # The allow rules.
  - id: policy-allow-docker
    completes: allow-host
    when:
      command: [sbx, policy, allow, network]
      args:
        0: "docker.com"
    then:
      state: { policy.dockerAllowed: true }
      output:
        - "  Added rule f652c735-f8f6-4a6b-9b9e-51ebc6d52545 to policy local (scope: global): docker.com [tcp]"

  - id: policy-allow-any
    when:
      command: [sbx, policy, allow, network]
      args:
        0: { any: true }
    then:
      output:
        - "  Added rule 00adf6c6-bb88-40db-9bb3-c02e5578c665 to policy local (scope: global): {{ args.0 }} [tcp]"

  - id: policy-deny-any
    when:
      command: [sbx, policy, deny, network]
      args:
        0: { any: true }
    then:
      state: { policy.adsDenied: true }
      output:
        - "  Added rule 25ef9968-9e47-4a60-a2ba-febeb9bf6dc2 to policy local (scope: global): {{ args.0 }} [tcp,udp]"

  # The real command asks for confirmation: the simulation shows the question, answered y.
  - id: policy-rm-docker
    completes: remove-rules
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: "docker.com"
    then:
      state: { policy.dockerAllowed: false }
      output:
        - "  Remove network rules from global (resources=docker.com)? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources=docker.com"

  - id: policy-rm-ads
    completes: remove-rules
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: "ads.example.com"
    then:
      state: { policy.adsDenied: false }
      output:
        - "  Remove network rules from global (resources=ads.example.com)? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources=ads.example.com"

  - id: policy-rm-any
    when:
      command: [sbx, policy, rm, network]
      args:
        --resource: { any: true }
    then:
      output:
        - "  Remove network rules from global (resources={{ args.resource }})? (y/N) y"
        - ""
        - "  Removed rule from policy local: resources={{ args.resource }}"

  # sbx policy log: one table per sandbox, abridged to the columns the lab needs.
