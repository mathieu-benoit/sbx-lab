        - "HOST IP     HOST PORT   SANDBOX PORT   PROTOCOL"
        - "127.0.0.1   3001        3000           tcp4"
        - "127.0.0.1   8000        8000           tcp4"

  - id: ports-ls-api
    completes: list-ports
    when:
      command: [sbx, port, ls, quickstart]
      state: { ports.api: true }
    then:
      output:
        - "HOST IP     HOST PORT   SANDBOX PORT   PROTOCOL"
        - "127.0.0.1   8000        8000           tcp4"

  - id: ports-ls-web
    completes: list-ports
    when:
      command: [sbx, port, ls, quickstart]
      state: { ports.web: true }
    then:
      output:
        - "HOST IP     HOST PORT   SANDBOX PORT   PROTOCOL"
        - "127.0.0.1   3001        3000           tcp4"

  - id: ports-ls-none
    when:
      command: [sbx, port, ls, quickstart]
    then:
      output: ["No published ports"]

  # A port declared by a kit is published at sbx create, on a host port sbx picks.
  - id: ports-ls-demo
    when:
      command: [sbx, port, ls, ports-demo]
      state: { sandboxes.portsDemo: true }
    then:
      output:
        - "HOST IP     HOST PORT   SANDBOX PORT   PROTOCOL"
        - "127.0.0.1   60000       8000           tcp4"

  # `curl` stands in for your browser: the simulation can't open localhost pages.
  - id: curl-api-health
    completes: reach-app
    when:
      command: [curl]
      args:
        0: "http://localhost:8000/health"
      state:
        ports.api: true
        stack.up: true
    then:
      output: ['{"status":"ok"}']

  - id: curl-api-docs
    completes: reach-app
    when:
      command: [curl]
      args:
        0: "http://localhost:8000/docs"
      state:
        ports.api: true
        stack.up: true
    then:
      output:
        - "<!DOCTYPE html>"
        - "<html>"
        - "<head>"
        - "<title>DevBoard API - Swagger UI</title>"
        - "..."

  - id: curl-frontend
    completes: reach-app
    when:
      command: [curl]
      args:
        0: "http://localhost:3001"
      state:
        ports.web: true
        stack.up: true
    then:
      output:
        - "<!DOCTYPE html><html lang=\"en\"><head><meta charSet=\"utf-8\"/>"
        - "<title>DevBoard</title>"
        - "..."

  - id: curl-demo-listing
    completes: kit-port
    when:
      command: [curl]
      args:
        0: { oneOf: ["http://127.0.0.1:60000/", "http://127.0.0.1:60000", "http://localhost:60000/"] }
      state: { ports.demoServer: true }
    then:
      output:
        - "<!DOCTYPE HTML>"
        - "<html lang=\"en\">"
        - "<head><title>Directory listing for /</title></head>"
        - "<body>"
        - "<h1>Directory listing for /</h1>"
        - "<ul>"
        - "<li><a href=\"AGENTS.md\">AGENTS.md</a></li>"
        - "<li><a href=\"README.md\">README.md</a></li>"
        - "<li><a href=\"backend/\">backend/</a></li>"
        - "<li><a href=\"docker-compose.yml\">docker-compose.yml</a></li>"
        - "<li><a href=\"frontend/\">frontend/</a></li>"
        - "<li><a href=\"kits/\">kits/</a></li>"
        - "<li><a href=\"prompts/\">prompts/</a></li>"
        - "</ul>"
        - "</body>"
        - "</html>"

  - id: curl-refused
    when:
      command: [curl]
      args:
        0: { any: true }
    then:
      stderr:
        - "curl: (7) Failed to connect to {{ args.0 }}: Couldn't connect to server"
        - "Nothing is published there, or the service isn't running: see sbx port ls and sbx ls."
      exit: 7

  # ════════════════════════════════════════════════════════════════════════
  # Module 10: MCP servers
  # ════════════════════════════════════════════════════════════════════════

  - id: mcp-add-dhi
    completes: register-dhi
    when:
      command: [sbx, mcp, add, dhi]
    then:
      state: { mcp.registered: true }
      output:
        - "Opening your browser to authorize the server with your Docker account..."
        - { text: "✓ Registered MCP server 'dhi' (remote http, https://dhi.io/mcp)", delay: medium }

  - id: mcp-ls-registered
    when:
      command: [sbx, mcp, ls]
      state: { mcp.registered: true }
    then:
      output:
        - "NAME   TRANSPORT     STATUS   GATEWAY                 DETAIL"
        - "dhi    remote http   ready    LOCAL, managed by you"

  - id: mcp-ls-empty
    when:
      command: [sbx, mcp, ls]
    then:
      output: ["No MCP servers registered."]

  - id: mcp-rm-dhi
    when:
      command: [sbx, mcp, rm, dhi]
    then:
      state: { mcp.registered: false }
      output: ["✓ Removed MCP server 'dhi'"]

  # ════════════════════════════════════════════════════════════════════════
  # Removing sandboxes and secrets. The wrap up has no cleanup in the simulated lab,
  # but sbx rm --force ports-demo runs in module 09, and a learner can still type the others.
  # `--force` swallows the name that follows it, so `sbx rm --force ports-demo`
  # arrives with no positional argument (see the flag parser).
  # ════════════════════════════════════════════════════════════════════════

  - id: rm-lab-sandboxes
    when:
      command: [sbx, rm]
      args:
        0: "quickstart"
        4: "dhi"
    then:
      state:
        sandboxes.quickstart: false
        sandboxes.fixBugs: false
        sandboxes.addSearch: false
        sandboxes.addNotif: false
        sandboxes.mcp: false
        stack.up: false
        ports.api: false
        ports.web: false
      output:
        - "✓ Removed sandbox 'quickstart' (its images, containers and PostgreSQL data too)"
        - "✓ Removed sandbox 'fix-bugs' (fetched branches stay under refs/sandboxes/fix-bugs/*)"
        - "✓ Removed sandbox 'add-search' (fetched branches stay under refs/sandboxes/add-search/*)"
        - "✓ Removed sandbox 'add-notif' (fetched branches stay under refs/sandboxes/add-notif/*)"
        - "✓ Removed sandbox 'dhi'"

  - id: rm-quickstart
    when:
      command: [sbx, rm]
      args:
        0: "quickstart"
    then:
      state:
        sandboxes.quickstart: false
        stack.up: false
        ports.api: false
        ports.web: false
      output: ["✓ Removed sandbox 'quickstart'"]

  - id: rm-shell-demo
    when:
      command: [sbx, rm]
      args:
        0: "shell-demo"
    then:
      state: { sandboxes.shellDemo: false }
      output: ["✓ Removed sandbox 'shell-demo'"]

  - id: rm-ports-demo
    when:
      command: [sbx, rm]
      args:
        --force: "ports-demo"
    then:
      state:
        sandboxes.portsDemo: false
        ports.demoServer: false
      output: ["✓ Removed sandbox 'ports-demo'"]

  - id: rm-any
    when:
      command: [sbx, rm]
      args:
        0: { any: true }
    then:
      output: ["✓ Removed sandbox '{{ args.0 }}'"]

  - id: secret-rm-github
    when:
      command: [sbx, secret, rm, github]
    then:
      state: { secrets.github: false }
      output: ["✓ Removed secret 'github'"]

  - id: secret-rm-copilot
    when:
      command: [sbx, secret, rm, copilot]
    then:
      state: { secrets.copilot: false }
      output: ["✓ Removed secret 'copilot'"]
