        - "  first page_size rows. It should be (page - 1) * page_size."
        - "- updated_at: the Column definitions in models.py have no onupdate, so the value stays frozen."
        - "- Search (xfail): the endpoint still returns 501, as expected."

  - id: agent-fix-pagination
    completes: fix-pagination
    when:
      agent: true
      promptContains: [pagination, bug]
      state: { code.paginationFixed: false }
    then:
      files:
        - replace: "project/backend/app/routers/issues.py"
          find: "skip = page * page_size"
          with: "skip = (page - 1) * page_size"
      state: { code.paginationFixed: true }
      output:
        - { text: "● Read backend/app/routers/issues.py, backend/tests/test_issues.py", delay: work }
        - ""
        - "The bug: list_issues() computes skip = page * page_size. Pages start at 1, so page 1 skips"
        - "the first page_size rows (page 1 of 5 issues with page_size=3 returns 2), and page 2 of a"
        - "6-item list skips everything and comes back empty."
        - ""
        - "● Edit backend/app/routers/issues.py"
        - "    - skip = page * page_size"
        - "    + skip = (page - 1) * page_size"
        - { text: "● Run: pytest tests/test_issues.py::test_pagination_first_page_returns_results -v  PASSED", delay: work }
        - { text: "● Run: pytest tests/test_issues.py::test_pagination_second_page -v               PASSED", delay: work }

