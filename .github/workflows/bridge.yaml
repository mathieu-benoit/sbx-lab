name: bridge

# The Labspace bridge (labspace-local/bridge): tested on every change, and released as binaries
# when a bridge-v* tag is pushed. The binaries are not in the repository: start.sh and start.ps1
# download them from the release, and check them against labspace-local/bridge/release.lock.
#
# To release:
#   git tag bridge-v0.1.0 && git push origin bridge-v0.1.0
#   # once the release is published:
#   labspace-local/bridge/lock.sh bridge-v0.1.0     # then commit release.lock
on:
  push:
    branches: [main]
    tags: ["bridge-v*"]
    paths:
      - "labspace-local/bridge/**"
      - ".github/workflows/bridge.yaml"
  pull_request:
    paths:
      - "labspace-local/bridge/**"
      - ".github/workflows/bridge.yaml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: labspace-local/bridge

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: labspace-local/bridge/go.mod
          cache-dependency-path: labspace-local/bridge/go.sum
      - run: go generate ./...
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: labspace-local/bridge/go.mod
          cache-dependency-path: labspace-local/bridge/go.sum
      - name: Build the binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go generate ./...
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/labspace-bridge-$os-$arch$ext" .
          done
          (cd dist && sha256sum labspace-bridge-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: labspace-local/bridge/dist/labspace-bridge-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "Labspace bridge ${VERSION#bridge-}" \
            --notes "Binaries of the Labspace bridge (labspace-local/bridge), downloaded by labspace-local/start.sh and start.ps1. Update labspace-local/bridge/release.lock with: labspace-local/bridge/lock.sh $VERSION"
