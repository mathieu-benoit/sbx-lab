name: pages

# Publishes the repository's GitHub Pages site, which holds both web versions of the lab:
#   /           a landing page: what the lab covers, and a blade for each version of it (.github/pages/home/)
#   /lab/       the hands-on lab (README.md + instructions/), in the Simspace runtime's instructions
#               panel, without terminals (.github/pages/)
#   /simspace/  the simulated lab (simspace/), as dockersamples/simspace's deploy-lab.yml builds it
#   /labspace/  the static preview of the Labspace rendering (labspace-local/static)
# A repository has a single Pages site, so they are built into one artifact here, instead of
# two workflows each replacing the other's site. Enable Pages first: Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "simspace/**"
      - "README.md"
      - "instructions/**"
      - "labspace-local/static/**"
      - "labspace-local/content.mjs"
      - "labspace-local/theme.css"
      - "labspace-local/labspace-ui.js"
      - ".github/pages/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Same defaults as dockersamples/simspace's deploy-lab.yml
  LABS_DIR: simspace/labs
  SIMSPACE_RUNTIME_IMAGE: dockersamples/simspace
  SIMSPACE_AUTHORING_IMAGE: dockersamples/simspace-authoring
  # "latest" tracks the newest runtime; pin to a released version (e.g. "1") for stability.
  SIMSPACE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate the labs (simulated lab + hands-on lab as a Simspace lab)
        run: |
          set -euo pipefail
          node .github/pages/build-instructions.mjs _instructions/labs
          # Name each code block's header after where it runs (id=host or id=sandbox). This
          # rewrites the checkout's copy of the simulated lab: the deployed one, not the source.
          node .github/pages/label-code-blocks.mjs "$LABS_DIR" _instructions/labs
          for dir in "$LABS_DIR" _instructions/labs; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/$dir:/labs:ro" \
              "$SIMSPACE_AUTHORING_IMAGE:$SIMSPACE_TAG" \
              npm run validate-lab -- /labs
          done

      # ---- /lab/ and /simspace/ : the Simspace runtime payload + labs + catalog (the steps of
      # deploy-lab.yml), once with the hands-on lab and once with the simulated lab
      - name: Assemble the Simspace sites
        run: |
          set -euo pipefail
          image="$SIMSPACE_RUNTIME_IMAGE:$SIMSPACE_TAG"
          docker pull "$image"
          cid="$(docker create "$image")"
          mkdir -p _runtime
          docker cp "$cid":/usr/share/nginx/html/. _runtime/
          docker rm "$cid"
          assemble() { # <labs dir> <site dir>
            mkdir -p "$2"
            cp -R _runtime/. "$2/"
            rm -rf "$2/labs" "$2/labs.json"
            # The runtime ships a dev config.json (localhost tracking): no tracking, no title here
            rm -f "$2/config.json"
            mkdir -p "$2/labs"
            cp -R "$1/." "$2/labs/"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" \
              "$SIMSPACE_AUTHORING_IMAGE:$SIMSPACE_TAG" \
              npm run generate-catalog -- "/work/$1" "/work/$2/labs.json"
          }
          assemble _instructions/labs _site/lab
          assemble "$LABS_DIR" _site/simspace

          # lab/ : only the instructions panel (instructions-only.css hides the terminal side).
          # Fail if the runtime renamed what the stylesheet relies on.
          for c in labspace-resize-handle labspace-panel terminal-panel workshop-panel workshop-header-bar workshop-progress-track workshop-body; do
            grep -qF "$c" _site/lab/assets/*.css || { echo "::error::the runtime has no .$c any more: update .github/pages/instructions-only.css"; exit 1; }
          done
          cp .github/pages/instructions-only.css _site/lab/
          sed -i 's|</head>|  <link rel="stylesheet" href="./instructions-only.css">\n  </head>|' _site/lab/index.html
          grep -qF 'instructions-only.css' _site/lab/index.html

          # lab/ and simspace/ : click a Mermaid diagram to open it in a zoomable popup.
          grep -qF 'aria-roledescription' _site/lab/assets/*.js || { echo "::error::the runtime's diagrams changed: update .github/pages/diagram-zoom.js"; exit 1; }
          for site in _site/lab _site/simspace; do
            cp .github/pages/diagram-zoom.js "$site/"
            sed -i 's|</head>|  <script defer src="./diagram-zoom.js"></script>\n  </head>|' "$site/index.html"
            grep -qF 'diagram-zoom.js' "$site/index.html"
          done

          # lab/ and simspace/ : the label above the lab's title, "Labspace" in the runtime: "Lab" for
          # the hands-on lab (the instructions only), "Simspace" for the simulated lab. labspace/ keeps its own.
          label() { # <site dir> <label>
            files="$(grep -lF 'eyebrow:"Labspace"' "$1"/assets/*.js)" || { echo "::error::the runtime has no eyebrow:\"Labspace\" any more: update the header label step"; exit 1; }
            sed -i "s|eyebrow:\"Labspace\"|eyebrow:\"$2\"|" $files
            grep -qF "eyebrow:\"$2\"" $files
          }
          label _site/lab Lab
          label _site/simspace Simspace

          # lab/ and simspace/ : the icon of the code blocks labelled host or sandbox.
          for c in code-block-label code-block-label-icon; do
            grep -qF ".$c{" _site/lab/assets/*.css || { echo "::error::the runtime has no .$c any more: update .github/pages/code-blocks.css"; exit 1; }
          done
          grep -qF 'dataFilename' _site/lab/assets/*.js || { echo "::error::the runtime doesn't show filename= any more: update .github/pages/label-code-blocks.mjs"; exit 1; }
          for site in _site/lab _site/simspace; do
            cp .github/pages/code-blocks.css "$site/"
            sed -i 's|</head>|  <link rel="stylesheet" href="./code-blocks.css">\n  </head>|' "$site/index.html"
            grep -qF 'code-blocks.css' "$site/index.html"
          done

          # Both service workers serve everything cache-first and never refresh it: with the cleanup
          # and the commit, each deploy installs a new worker that drops the stale cache.
          for site in _site/lab _site/simspace; do
            cat .github/pages/sw-cleanup.js >> "$site/sw.js"
            echo "// Deployed from $GITHUB_SHA" >> "$site/sw.js"
          done

      # ---- / : the landing page, with its own sw.js, which retires the service worker that the
      # root had when it served the hands-on lab
      - name: Add the landing page
        run: |
          set -euo pipefail
          cp -R .github/pages/home/. _site/
          # The README's overview, shared by both labs, written by build-instructions.mjs
          cp _instructions/overview.md _site/
          # Click the diagram to zoom, as in the labs
          cp .github/pages/diagram-zoom.js _site/
          test -f _site/index.html && test -f _site/sw.js && test -s _site/overview.md

      # ---- /labspace/ : the static preview of the Labspace rendering
      - name: Build the Labspace preview
        run: node labspace-local/static/build.mjs --base "/${{ github.event.repository.name }}/labspace/" --out _site/labspace

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
